<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Znajdź taksówkę — auta na taxi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef1f6; --s:#fff; --ink:#0f172a; --mut:#64748b; --brd:#e2e8f0;
  --acc:#1d4ed8; --acc2:#eff6ff; --amber:#f59e0b; --amber2:#fffbeb;
  --ok:#059669; --ok2:#ecfdf5; --bad:#dc2626; --bad2:#fef2f2; --warn:#b45309;
  --nav:#0f172a; --r:15px;
}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}
button{font-family:inherit}
.hide{display:none!important}
/* ===== layout ===== */
.wrap{max-width:1180px;margin:0 auto;padding:0 10px 20px}
header{position:sticky;top:0;z-index:40;background:var(--nav);color:#fff;padding:10px 12px 8px;
  box-shadow:0 2px 10px rgba(2,6,23,.22)}
.hrow{display:flex;align-items:center;gap:8px;max-width:1180px;margin:0 auto}
h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px;flex:1;white-space:nowrap}
.ver{font-size:10.5px;font-weight:800;color:#475569;background:#e2e8f0;border-radius:99px;padding:2px 7px}
.hbtn{border:0;border-radius:10px;background:#1e293b;color:#e2e8f0;padding:7px 10px;font-weight:700;
  display:inline-grid;place-items:center;line-height:0;cursor:pointer}
.hbtn svg{display:block}
.hbtn:active{background:#334155}
.hsub{font-size:11.5px;color:#94a3b8;margin:5px auto 0;max-width:1180px}
.hsub b{color:#e2e8f0}
.hsub .am{color:#fbbf24}
/* ===== nav ===== */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--brd);box-shadow:0 -2px 12px rgba(15,23,42,.07)}
.bnav button{flex:1;border:0;background:transparent;border-radius:11px;padding:5px 2px;font-size:10px;font-weight:800;
  color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.bnav button b{font-size:18px;line-height:1.15;font-weight:400}
.bnav button.on{color:var(--acc);background:var(--acc2)}
.side{display:none}
/* ===== cards ===== */
.card{background:var(--s);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin:0 0 12px;
  box-shadow:0 1px 3px rgba(15,23,42,.05);position:relative;will-change:transform}
.card .top{position:relative;background:#cbd5e1}
.card .top img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
.card .tags{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:78%}
.card .fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(15,23,42,.55);color:#fff;font-size:17px;display:grid;place-items:center;backdrop-filter:blur(4px);cursor:pointer}
.card .fav.on{background:var(--amber);color:#111827}
.card .in{padding:10px 12px 11px}
.ct{font-weight:800;font-size:14.5px;margin:0 0 3px;letter-spacing:-.2px;overflow-wrap:anywhere}
.cm{font-size:11.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.cm i{font-style:normal;color:#cbd5e1}
.prow{display:flex;align-items:baseline;gap:8px;margin:7px 0 1px;flex-wrap:wrap}
.price{font-size:19px;font-weight:900;letter-spacing:-.5px}
.price small{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0}
.tot{font-size:11.5px;color:var(--mut)}
.tot b{color:var(--ink)}
.strip{display:flex;align-items:center;gap:7px;margin:8px 0 0;background:#f8fafc;border:1px solid var(--brd);
  border-radius:10px;padding:6px 8px;font-size:11.5px;overflow:hidden;flex-wrap:wrap}
.strip .fuel{flex-basis:100%;order:9;color:var(--mut);font-size:10.5px;line-height:1.25}
.strip b{font-size:12.5px}
.strip .bar{flex:1;min-width:24px;height:6px;border-radius:4px;background:#e2e8f0;position:relative;overflow:hidden}
.strip .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#10b981,#84cc16);border-radius:4px}
.acts{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.ab{border:1px solid var(--brd);background:#fff;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:#334155;cursor:pointer;text-decoration:none;line-height:1.2}
.ab i{font-style:normal;font-size:15px;line-height:1.1}
.ab.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.ab.on{background:var(--amber2);border-color:#fcd34d;color:#92400e}
.ab.dg{background:var(--bad2);border-color:#fecaca;color:#991b1b}
.ab.onCon{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row .ab{flex:1 1 46%;flex-direction:row;gap:5px;padding:8px 6px;font-size:11.5px;justify-content:center}
/* badges */
.tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap;letter-spacing:.2px}
.t-new{background:#dcfce7;color:#166534}
.t-drop{background:#fef3c7;color:#92400e}
.t-rise{background:#fee2e2;color:#991b1b}
.t-lpg{background:#e0f2fe;color:#075985}
.t-deal{background:#111827;color:#fbbf24}
.t-olx{background:#e0f2fe;color:#075985}
.t-oto{background:#fef3c7;color:#92400e}
.t-watch{background:#f5f3ff;color:#5b21b6}
.t-own{background:#ede9fe;color:#5b21b6}
.t-gone{background:#fee2e2;color:#991b1b}
.t-ok{background:#ecfdf5;color:#047857}
.t-near{background:#fffbeb;color:#b45309}
.t-out{background:#f1f5f9;color:#64748b}
/* ===== chips / toolbars ===== */
.tools{position:sticky;top:52px;z-index:30;background:var(--bg);padding:8px 0 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;margin:0 -10px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chips>*{scroll-snap-align:start;flex:0 0 auto}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible;mask-image:none;-webkit-mask-image:none}.chips>*{flex:0 0 auto}}
.chip{flex:0 0 auto;border:1px solid var(--brd);background:#fff;border-radius:99px;padding:6px 11px;font-size:12px;
  font-weight:700;color:#334155;white-space:nowrap;display:flex;gap:5px;align-items:center;cursor:pointer}
.chip.on{background:var(--nav);border-color:var(--nav);color:#fff}
.chip .n{background:#e2e8f0;color:#0f172a;border-radius:99px;font-size:10.5px;padding:0 5px;font-weight:800}
.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.chip.off{opacity:.45}
.chip.amb.on{background:var(--amber);border-color:var(--amber);color:#111827}
.chip.amb.on .n{background:rgba(0,0,0,.15);color:#111827}
.sortrow{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--mut);padding:0 0 8px;flex-wrap:wrap}
.sel,.inp{border:1px solid var(--brd);border-radius:10px;padding:7px 9px;font-size:12.5px;font-weight:700;background:#fff;color:var(--ink);font-family:inherit}
.cntlbl{margin-left:auto;font-weight:800;color:var(--ink);font-size:12px}
/* ===== empty / intro ===== */
.empt{background:#fff;border:1px dashed #cbd5e1;border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--mut);font-size:13px}
.empt b{color:var(--ink)}
.empt .ab{display:inline-flex;flex-direction:row;gap:6px;margin-top:10px;background:var(--acc);color:#fff;border-color:var(--acc);padding:9px 14px;font-size:12.5px}
/* ===== sheet / modal ===== */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -10px 30px rgba(15,23,42,.28);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--brd);flex:0 0 auto}
.sheet .sh b{font-size:15px;flex:1}
.sheet .sc{overflow:auto;padding:0 14px 8px;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);display:flex;gap:8px;flex:0 0 auto;background:#fff}
.grab{width:38px;height:4px;border-radius:99px;background:#cbd5e1;margin:7px auto 0}
.sect{margin:14px 0 6px;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#64748b;
  display:flex;justify-content:space-between;align-items:center}
.sect a,.sect button{color:var(--acc);font-size:11px;letter-spacing:0;text-transform:none;font-weight:800;background:none;border:0;cursor:pointer;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--brd);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;color:#334155;
  display:flex;gap:5px;align-items:center;cursor:pointer}
.opt.on{background:var(--nav);border-color:var(--nav);color:#fff}
.opt .n{background:#e2e8f0;color:#0f172a;border-radius:99px;font-size:10px;padding:0 5px;font-weight:800}
.opt.on .n{background:rgba(255,255,255,.22);color:#fff}
.opt.off{opacity:.42}
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:10px}
.modal .box{background:#fff;border-radius:16px;width:100%;max-width:960px;max-height:92vh;overflow:auto;padding:12px}
.modal .box .sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.modal .box .sh b{flex:1;min-width:0;font-size:15px}
.row2{display:flex;gap:8px;align-items:center}
.row2>*{flex:1 1 0;min-width:0;width:auto}
.inp{min-width:0}
/* ===== models screen ===== */
.mtabs{display:flex;gap:4px;background:#e2e8f0;border-radius:11px;padding:3px;margin:0 0 10px}
.mtabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-size:12px;font-weight:800;color:#475569;cursor:pointer}
.mtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pack{border:1px solid var(--brd);border-radius:14px;background:#fff;margin-bottom:9px;overflow:hidden}
.pack .ph{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.pack .em{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.pack .nm{flex:1;min-width:0}
.pack .nm b{display:block;font-size:13.5px;letter-spacing:-.1px}
.pack .nm b.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.25}
.pack .nm span{font-size:11px;color:var(--mut)}
.btn-add{border:0;border-radius:9px;font-size:11px;font-weight:800;padding:7px 10px;white-space:nowrap;cursor:pointer;
  background:var(--nav);color:#fff}
.btn-add.on{background:var(--ok2);color:#047857;box-shadow:inset 0 0 0 1px #a7f3d0}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #f1f5f9}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{font-size:13px;display:block;letter-spacing:-.1px}
.mrow .nm span{font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm span.sub2{font-size:10.5px;color:#94a3b8;margin-top:1px}
.mrow .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mrow .mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.mrow .mini button{border:1px solid var(--brd);background:#fff;border-radius:8px;font-size:10.5px;font-weight:800;padding:4px 7px;color:#334155;cursor:pointer}
.tog{width:44px;height:26px;border-radius:99px;background:#cbd5e1;position:relative;flex:0 0 auto;border:0;cursor:pointer;transition:background .15s}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog.on{background:var(--ok)}
.tog.on i{left:21px}
.conf{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:3px}
.conf b{color:var(--ink);font-size:11.5px}
/* ===== market ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--brd);border-radius:14px;padding:10px 12px}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:800}
.kpi b{display:block;font-size:22px;letter-spacing:-.8px;margin-top:1px}
.kpi em{font-style:normal;font-size:11px;font-weight:700;color:var(--ok)}
.kpi em.up{color:var(--warn)}
.timeline{background:#fff;border:1px solid var(--brd);border-radius:14px;overflow:hidden}
.trow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f5f9;align-items:flex-start;cursor:pointer}
.trow:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.trow .txt{flex:1;font-size:12px;min-width:0;line-height:1.35}
.trow .tm{font-size:10px;color:#94a3b8;white-space:nowrap;flex:0 0 auto;padding-top:2px;letter-spacing:.2px}
/* ===== compare ===== */
.cmp table{border-collapse:collapse;width:100%;font-size:11.5px}
.cmp th,.cmp td{padding:7px 8px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
.cmp thead th{background:#f8fafc;font-size:11px;position:sticky;top:0;z-index:2}
.cmp tbody th{color:#475569;font-weight:700;white-space:nowrap;background:#fcfdff}
.cmp td.win{background:var(--ok2);font-weight:800;color:#047857}
/* ===== more ===== */
.mlist{background:#fff;border:1px solid var(--brd);border-radius:14px;overflow:hidden;margin-bottom:12px}
.mitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #f1f5f9;
  padding:12px 13px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none}
.mitem:last-child{border:0}
.mitem .em{font-size:17px;width:22px;text-align:center}
.mitem .sub{display:block;font-size:11.5px;font-weight:500;color:var(--mut);margin-top:1px}
.mitem .rt{margin-left:auto;color:#94a3b8;font-weight:800;font-size:13px}
/* ===== toast ===== */
#toast{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  pointer-events:none;z-index:120;padding:8px 10px}
#toast .ti{display:none;background:#0f172a;color:#fff;border-radius:12px;padding:10px 13px;font-size:12.5px;max-width:560px;
  box-shadow:0 8px 24px rgba(2,6,23,.35);align-items:center;gap:10px}
#toast.on .ti{display:flex}
#toast .ab{background:#fff;border-color:#fff;color:#0f172a;flex-direction:row;padding:5px 9px;font-size:11.5px}
#toast .x{background:transparent;border:1px solid #475569;color:#cbd5e1;border-radius:8px;padding:1px 6px;font-weight:700;cursor:pointer}
/* ===== selection ===== */
.selbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.selbar .ab{flex:0 0 auto;flex-direction:row;gap:5px;padding:7px 10px;border-style:dashed;border-color:#94a3b8;font-weight:700}
.selbar .hint{font-size:11.5px;color:#475569;flex:1;min-width:140px}
.bulkbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:55;display:none;gap:6px;
  align-items:center;flex-wrap:wrap;background:#fff;border-top:1px solid var(--brd);padding:8px 10px;box-shadow:0 -4px 16px rgba(15,23,42,.1)}
.bulkbar.on{display:flex}
body.selmode .card.cardsel{border-color:#93c5fd}
body.selmode .card.cardsel.onsel{box-shadow:0 0 0 2px var(--acc)}
.cbox{position:absolute;left:8px;top:8px;z-index:3;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.9);
  border:2px solid #94a3b8;display:grid;place-items:center;font-weight:900;color:#fff;font-size:13px}
.card.onsel .cbox{background:var(--acc);border-color:var(--acc)}
/* ===== swipe layers ===== */
.sw{position:relative;overflow:hidden;border-radius:var(--r);margin:0 0 12px}
.sw .card{margin:0;position:relative;z-index:2;touch-action:pan-y}
.sw .swbg{position:absolute;inset:0;z-index:1;display:flex;align-items:center;gap:8px;padding:0 20px;font-size:11.5px;
  font-weight:900;text-transform:uppercase;letter-spacing:.6px;opacity:.85}
.sw .swbg.l{justify-content:flex-end;background:linear-gradient(90deg,#fecaca,#fee2e2);color:#991b1b}
.sw .swbg.r{justify-content:flex-start;background:linear-gradient(270deg,#bbf7d0,#dcfce7);color:#166534}
/* ===== details ===== */
details.det{margin-top:8px;background:#f8fafc;border:1px solid var(--brd);border-radius:10px;padding:7px 9px;font-size:12px}
details.det>summary{cursor:pointer;list-style:none;font-weight:800;color:#334155}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::before{content:"▸ ";color:var(--acc)}
details.det[open]>summary::before{content:"▾ "}
details.det table{width:100%;border-collapse:collapse;margin-top:6px;table-layout:auto}
details.det tr+tr{border-top:1px solid #eef2f7}
details.det tr:last-child td{padding-top:5px}
details.det td{padding:2.5px 0;font-size:11.5px;vertical-align:top;line-height:1.35}
details.det td:first-child{white-space:nowrap;color:#475569;padding-right:10px}
details.det td:last-child{text-align:right;font-weight:700}
/* ===== desktop ===== */
@media(min-width:900px){
  body{padding-bottom:20px}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:3px;position:fixed;left:0;top:0;bottom:0;width:228px;background:var(--nav);
    padding:16px 12px;z-index:50}
  .side .logo{font-weight:900;color:#fff;font-size:15px;margin:0 4px 16px;display:flex;gap:8px;align-items:center;letter-spacing:-.3px}
  .side button{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:10px;border:0;background:transparent;
    color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;text-align:left;width:100%}
  .side button.on{background:#1e293b;color:#fff}
  .side button .n{margin-left:auto;background:#334155;color:#e2e8f0;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}
  .side .ft{margin-top:auto;font-size:11px;color:#64748b;line-height:1.5;padding:0 4px}
  .shell{margin-left:228px}
  header{padding-left:16px;padding-right:16px}
  .hrow,.hsub{max-width:100%}
  .wrap{max-width:1120px;padding:0 16px 24px}
  #offers{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #offers .sw{margin:0}
  .card .top img{height:170px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .tools{top:54px}
  .sheet{max-width:720px;border-radius:20px;margin:auto}
  .ovl{align-items:center}
}
@media(min-width:1240px){
  #offers{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="side" id="side"></div>
<div class="shell">
  <header>
    <div class="hrow">
      <h1 id="htitle">Oferty</h1>
      <span class="ver" id="ver">v7.0</span>

  return n;

async function fetchURL(url,ms){
  ms=ms||14000;
  const c=new AbortController(),t=setTimeout(function(){c.abort();},ms);
  let th=null;
  try{
    const hard=new Promise(function(_,rej){th=setTimeout(function(){rej(new Error('przekroczony czas'));},ms+400);});
    const r=await Promise.race([fetch(url,{signal:c.signal}),hard]);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }finally{clearTimeout(t);if(th)clearTimeout(th);}
}
async function relayGet(target,relay,ms){
  const u=relay.u(target);if(!u)throw new Error('brak adresu');
  let txt=(await fetchURL(u,ms||15000)).trim();
  if(relay.w==='contents'){const j=JSON.parse(txt);txt=j.contents||'';}
  if(!txt.startsWith('{'))throw new Error('nie-JSON');
  return JSON.parse(txt);
}
function markStale(src,j){
  /* oferta, której nie ma w świeżym pliku, a była widziana PRZED jego wygenerowaniem,
     traktujemy jako znikniętą. Nowsze (np. z „Odśwież" na żywo) zostawiamy w spokoju. */
  const gen=j&&j.generated_at?new Date(j.generated_at).getTime():0;
  if(!gen)return 0;
  const ids={};(j.offers||[]).forEach(function(o){ids[o.id]=1;});
  let n=0;
  Object.keys(ST.db.offers).forEach(function(k){
    const o=ST.db.offers[k];
    if(!o||sourceOf(o)!==src||ids[k]||o.missing_since)return;
    if(new Date(o.last_seen||0).getTime()<gen){o.missing_since=nowISO();n++;}
  });
  return n;
}

async function checkOffer(id){
  const o=ST.db.offers[id];
  if(!o){toast('Nie znalazłem tej oferty w danych — kliknij „🔄 Odśwież".');return;}
  if(sourceOf(o)==='otomoto'){return checkOtomoto(id);}
  if(OPEN['chk_'+id])return;
  OPEN['chk_'+id]=true;render();
  toast('⏳ Sprawdzam ogłoszenie na OLX…',{ms:12000});
  const numId=String(id).replace('olx-','');
  const t0=Date.now();
  const relays=RELAYS.filter(function(R){return !(R.n==='worker'&&!ST.settings.worker);});
  const online=(typeof navigator==='undefined'||navigator.onLine!==false);
  let fellBack=false;
  try{
    if(online){
      for(let i=0;i<relays.length;i++){
        const R=relays[i];
        try{
          const d=await relayGet('https://www.olx.pl/api/v1/offers/'+numId+'/',R,3500);
          const dd=(d&&d.data)?d.data:d;
          const stat=(dd&&dd.status)?dd.status:'nieznany';
          const active=(stat==='active'||stat==='active_limited');
          const vt=((dd&&dd.valid_to_time)||o.valid_to||null);
          ST.checks=ST.checks||{};
          ST.checks[id]={at:nowISO(),st:active?'active':'gone',valid_to:vt,src:R.n};
          if(!active){o.missing_since=o.missing_since||nowISO();}
          save();OPEN['chk_'+id]=false;render();
          if(active){
            toast('✅ Ogłoszenie <b>AKTYWNE</b> — ważne do <b>'+d2(vt)+'</b> (sprawdzone: '+R.n+')',
              {act:"copyQ()",actLabel:'📋 Pytania',ms:30000});
          }else{
            toast('❌ Ogłoszenie <b>nie jest już aktywne</b> (status: '+stat+')',
              {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
          }
          return;
        }catch(e){}
        if(Date.now()-t0>9000)break;
      }
    }
    const exp=o.valid_to?new Date(o.valid_to).getTime():null;
    let st='unknown';
    if(exp){st=(exp<Date.now())?'gone':'likely';}
    ST.checks=ST.checks||{};
    ST.checks[id]={at:nowISO(),st:st,valid_to:o.valid_to||null,src:(online?'z danych (bez połączenia)':'z danych (offline)')};
    save();fellBack=true;
  }catch(err){
    toast('⚠️ Błąd podczas sprawdzania: '+esc((err&&err.message)||err),{ms:15000});
  }finally{
    OPEN['chk_'+id]=false;render();
  }
  if(fellBack){
    if((ST.checks[id]||{}).st==='gone'){
      toast('🕸️ Ogłoszenie wygląda na <b>nieaktualne</b> (dane: ważne do '+d2(o.valid_to)+')',
        {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
    }else{
      toast('🕰️ Nie udało się potwierdzić na żywo. Z danych: <b>ważne do '+d2(o.valid_to)+'</b>.',
        {act:"checkOffer('"+id+"')",actLabel:'🔁 Spróbuj ponownie',ms:30000});
    }
  }
}

function otoParse(txt){
  const m=txt.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
  if(!m)throw new Error('brak danych ogłoszenia');
  const d=JSON.parse(m[1]);
  const ad=d&&d.props&&d.props.pageProps&&d.props.pageProps.advert;
  if(!ad)throw new Error('brak ogłoszenia w odpowiedzi');

async function checkOtomoto(id){

  toast('⏳ Sprawdzam ogłoszenie na OTOMOTO…',{ms:12000});
  const t0=Date.now();
  const tries=[{n:'direct',u:function(t){return t;}}].concat(
    RELAYS.filter(function(R){return !(R.n==='worker'&&!ST.settings.worker);}));
  try{
    if(o.url){
      for(let i=0;i<tries.length;i++){
        const R=tries[i];
        try{
          const u=R.u(o.url); if(!u)continue;
          const txt=await fetchURL(u,5000);
          const ad=otoParse(txt);
          const stat=ad.status?String(ad.status).toUpperCase():'ACTIVE';
          const active=(stat==='ACTIVE');

              {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
          }
          return;
        }catch(e){}
        if(Date.now()-t0>14000)break;
      }
    }
    /* OTOMOTO blokuje zapytania z przeglądarki — mówimy wprost, kiedy robot
       ostatnio widział tę ofertę, zamiast udawać, że sprawdziliśmy na żywo */
    const ls=o.last_seen?new Date(o.last_seen):null;

      ST.checks[id]={at:nowISO(),st:'likely',valid_to:null,src:'otomoto.json'};
      save();render();
      toast('✅ Robot widział tę ofertę <b>'+when+'</b> — na dziś jest aktualna. '
        +'<span class="small">(OTOMOTO blokuje sprawdzanie wprost z przeglądarki, więc korzystam z ostatniego przebiegu.)</span>',
        {act:"openOto('"+id+"')",actLabel:'🔗 Otwórz i zobacz',ms:30000});
    }else{
      ST.checks[id]={at:nowISO(),st:'unknown',valid_to:null,src:'otomoto.json'};
      save();render();
      toast('⚠️ Ostatnio widziana <b>'+when+'</b>'+(hrs!=null?(' ('+Math.round(hrs/24)+' dni temu)'):'')
        +' — mogła zniknąć. Otwórz ogłoszenie i zobacz sam.',
        {act:"openOto('"+id+"')",actLabel:'🔗 Otwórz',ms:20000});
    }
  }finally{
    OPEN['chk_'+id]=false;render();
  }
}

/* --- synchronizacja między urządzeniami: dwa publiczne schowki JSON, bez tokenów --- */
const SYNC_KEYS=['fav','con','dis'];
const STORE_A='https://api.restful-api.dev/objects/';
const STORE_B='https://kvdb.io/';
function mergeMaps(a,b){
  const out={};
  for(const id in (a||{}))out[id]=a[id];
  for(const id in (b||{})){
    const x=a&&a[id],y=b[id];
    if(!x){out[id]=y;continue;}
    const tx=new Date(x.t||0).getTime(),ty=new Date(y.t||0).getTime();
    out[id]=ty>=tx?y:x;                       /* wygrywa nowszy wpis — także „wyłączony" (on:false) */
  }
  return out;
}
function mergeSync(local,remote){
  const out=Object.assign({},local);
  for(const k of SYNC_KEYS)out[k]=mergeMaps(local[k],remote[k]);
  return out;
}
function syncCfg(){
  const S=Object.assign({},SYNC_DEF,ST.settings.sync||{});
  if(!S.rid)S.rid=SYNC_DEF.rid;
  if(!S.kvbin)S.kvbin=SYNC_DEF.kvbin;
  if(!S.key)S.key=SYNC_DEF.key;
  return S;
}
function syncReady(){const S=syncCfg();return !!(S.rid||S.kvbin);}
function syncPayload(){
  const p={v:1,updated_at:nowISO(),app:'znajdz-taksowke'};
  for(const k of SYNC_KEYS)p[k]=ST[k]||{};
  return p;
}
/* — schowek 1: api.restful-api.dev (tworzy obiekt, potem PUT) — */
async function restGet(){
  const S=syncCfg();if(!S.rid)return null;
  const r=await fetch(STORE_A+S.rid,{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('schowek 1: HTTP '+r.status);
  const j=await r.json();
  return (j&&j.data)?j.data:null;
}
async function restPut(payload){
  const S=syncCfg();if(!S.rid)throw new Error('brak id schowka 1');
  const r=await fetch(STORE_A+S.rid,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'znajdz-taksowke',data:payload})});
  if(!r.ok)throw new Error('zapis 1: HTTP '+r.status);
}
/* — schowek 2: kvdb.io (zapasowy) — */
async function kvGet(){
  const S=syncCfg();if(!S.kvbin)return null;
  const r=await fetch(STORE_B+S.kvbin+'/'+S.key,{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('schowek 2: HTTP '+r.status);
  const t=await r.text();
  try{return JSON.parse(t);}catch(e){return null;}
}
async function kvPut(payload){
  const S=syncCfg();if(!S.kvbin)throw new Error('brak kodu schowka 2');
  const r=await fetch(STORE_B+S.kvbin+'/'+S.key,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('zapis 2: HTTP '+r.status);
}
/* — pobierz ze wszystkich schowków i scal — */
async function syncPull(){
  let out=null,errs=[];
  const tries=[['rest',restGet],['kv',kvGet]];
  for(const t of tries){
    try{const d=await t[1]();if(d&&typeof d==='object')out=out?mergeSync(out,d):d;}
    catch(e){errs.push(e.message);}
  }
  if(!out&&errs.length)throw new Error(errs.join(' · '));
  return out;
}
/* — zapisz do wszystkich schowków (wystarczy, że jeden przyjmie) — */
async function syncPush(payload){
  let okCount=0,errs=[];
  const tries=[restPut,kvPut];
  for(const f of tries){
    try{await f(payload);okCount++;}
    catch(e){errs.push(e.message);}
  }
  if(!okCount)throw new Error(errs.join(' · '));
  return okCount;
}
async function syncNow(silent){
  if(!syncReady()){if(!silent)toast('Synchronizacja nie ma ustawionego schowka.');return false;}
  try{
    const remote=await syncPull();
    let changed=false;
    if(remote){
      const before=JSON.stringify([ST.fav,ST.con,ST.dis]);
      const merged=mergeSync(ST,remote);
      if(JSON.stringify([merged.fav,merged.con,merged.dis])!==before){
        ST.fav=merged.fav;ST.con=merged.con;ST.dis=merged.dis;changed=true;
      }
    }
    const n=await syncPush(syncPayload());

function median(a){if(!a.length)return null;const b=a.slice().sort(function(x,y){return x-y;});const n=b.length;
  return n%2?b[(n-1)/2]:Math.round((b[n/2-1]+b[n/2])/2);}

/* ---------- okazja (cena vs mediana modelu, min. 5 ofert) ---------- */
let DEALC={};
function dealFor(o){
  const mid=miOf(o).id;if(mid==='inne')return null;
  const y=+o.year||0;const key=mid+'|'+(y?Math.floor(y/3):0);
  if(!(key in DEALC)){
    const bucket=offersArr().filter(function(x){
      if(isDis(x.id))return false;
      if(miOf(x).id!==mid)return false;
      if(!y)return true;
      return Math.abs((+x.year||0)-y)<=2;
    }).map(function(x){return +x.price||0;}).filter(function(p){return p>0;});
    DEALC[key]=bucket.length>=5?median(bucket):null;
  }
  const med=DEALC[key];if(!med)return null;
  const d=(med-o.price)/med;
  return Math.abs(d)<0.06?{pct:d,med:med}:{pct:d,med:med};
}
function isDeal(o){const d=dealFor(o);return !!(d&&d.pct>=0.08);}

/* ---------- MODELE ---------- */
const PACKS=[
  {id:'hyb',em:'🔋',name:'Hybrydy',test:function(m){return m.fuel==='hybrid';}},
  {id:'lpg',em:'⛽',name:'Benzyna + LPG',test:function(m){return m.fuel!=='hybrid';}},

  {id:'kia',em:'🇰🇷',name:'Kia & Hyundai',test:function(m){return m.brand==='Kia'||m.brand==='Hyundai';}},

  {id:'budget',em:'💸',name:'Mieszczą się w 40 tys.',test:function(m){return (m.price[0]+(m.fuel==='hybrid'?m.lpgCost:m.lpgCost)+baseSum())<=40000;}}
];
function packModels(p){return allModels().filter(p.test);}
function packWatched(p){const ms=packModels(p);return ms.filter(function(m){return isWatchModel(m.id);}).length;}
function renderModels(){
  const box=el('view');if(!box)return;
  const cf=cfg();
  const total=allModels().length;
  const hy=allModels().filter(function(m){return m.fuel==='hybrid';}).length;
  let html='<div class="mtabs">'
    +'<button class="'+(MSTAB==='cat'?'on':'')+'" onclick="setMStab(\'cat\')">📚 Katalog '+total+'</button>'
    +'<button class="'+(MSTAB==='watch'?'on':'')+'" onclick="setMStab(\'watch\')">⭐ Obserwowane · '+sumWatch()+'</button>'
    +'</div>';
  if(MSTAB==='cat'){
    html+='<div class="chips">'
      +'<span class="chip '+(QPACK===''?'on':'')+'" onclick="setPack(\'\')">Wszystkie '+total+'</span>'
      +'<span class="chip '+(QPACK==='hyb'?'on':'')+'" onclick="setPack(\'hyb\')">🔋 Hybrydy '+hy+'</span>'
      +'<span class="chip '+(QPACK==='lpg'?'on':'')+'" onclick="setPack(\'lpg\')">⛽ LPG '+(total-hy)+'</span>'
      +PACKS.slice(2,6).map(function(p){return '<span class="chip '+(QPACK===p.id?'on':'')+'" onclick="setPack(\''+p.id+'\')">'+p.em+' '+p.name+'</span>';}).join('')
      +'</div>'
      +'<div class="sortrow"><input class="inp" style="flex:1" placeholder="🔍 Szukaj modelu (np. Auris, Octavia)" value="'+esc(QMODEL)+'" oninput="setQModel(this.value)">'
      +'<button class="ab" style="flex:0 0 auto;flex-direction:row;gap:5px;border-color:#0f172a;background:#0f172a;color:#fff" onclick="openCustomModel()">＋ Model</button></div>';
    if(customModels().length){
      html+='<div class="pack"><div class="ph"><div class="em">✍️</div><div class="nm"><b>Twoje modele</b><span>'+customModels().length+' dodane ręcznie · możesz przejrzeć, edytować lub usunąć</span></div></div>'
        +customModels().map(function(m){
          return '<div class="mrow"><div class="nm"><b>'+esc(m.name)+' <span class="tag t-own">TWÓJ</span></b>'
            +'<span>'+esc(m.years||'')+' · '+num1(m.l100)+' l · '+zl2(zl100Model(m,true,cf))+'/100 km</span>'
            +'<div class="mini"><button onclick="showModelOffers(\''+m.id+'\')">🔍 Oferty</button>'
            +'<button onclick="openCustomModel(\''+m.id+'\')">✏️ Edytuj</button>'
            +'<button onclick="delCustomModel(\''+m.id+'\')" style="color:#991b1b">🗑 Usuń</button></div></div>'
            +'<button class="tog'+(isWatchModel(m.id)?' on':'')+'" onclick="toggleWatchModel(\''+m.id+'\')"><i></i></button></div>';
        }).join('')+'</div>';
    }
    const q=(QMODEL||'').toLowerCase();
    const packs=QPACK?PACKS.filter(function(p){return p.id===QPACK;}):PACKS;
    packs.forEach(function(p){
      let ms=packModels(p);
      if(q)ms=ms.filter(function(m){return (m.name+' '+m.short+' '+m.brand).toLowerCase().indexOf(q)>-1;});
      if(!ms.length)return;
      const watched=ms.filter(function(m){return isWatchModel(m.id);}).length;
      const cheapest=ms.reduce(function(a,m){const z=zl100Model(m,true,cfg());return z<a?z:a;},999);
      const open=QMODEL?true:(QPACK?true:watched>0||ms.length<=6);
      html+='<div class="pack"><div class="ph" onclick="this.parentNode.classList.toggle(\'closed\');this.querySelector(\'.btn-add\')&&null">'
        +'<div class="em">'+p.em+'</div><div class="nm"><b>'+p.name+'</b><span>'+ms.length+' modeli · od '+zl2(cheapest)+' zł/100 km'+(watched?(' · ⭐ '+watched):'')+'</span></div>'
        +'<button class="btn-add'+(watched===ms.length?' on':'')+'" onclick="event.stopPropagation();addPack(\''+p.id+'\')">'+(watched===ms.length?'✓ wszystkie':('＋ '+ms.length))+'</button></div>'
        +'<div class="rows" style="display:'+(open?'block':'none')+'">'
        +ms.map(function(m){
          const watchedM=isWatchModel(m.id),n=modelOffers(m.id).length;
          return '<div class="mrow"><div class="nm"><b>'+esc(m.name)+(isCustom(m)?' <span class="tag t-own">TWÓJ</span>':'')+'</b>'
            +'<span>'+esc(m.years||'')+' · '+num1(m.l100)+' l/100 km · '+zl2(zl100Model(m,true,cf))+' zł/100 km</span>'
            +'<span class="sub2">'+stars(m.rel||0)+' · '+(n?(n+(n===1?' oferta':(n<5?' oferty':' ofert'))):'brak ofert')+'</span></div>'
            +'<button class="tog'+(watchedM?' on':'')+'" title="'+(watchedM?'Przestań obserwować':'Obserwuj model')+'" onclick="toggleWatchModel(\''+m.id+'\')"><i></i></button></div>';
        }).join('')+'</div></div>';
    });
  }else{
    const ms=(ST.watchModels||[]).map(modelById).filter(Boolean);
    if(!ms.length){
      html+='<div class="empt">Nie obserwujesz jeszcze modeli.<br>Wybierz je w katalogu — ich oferty trafią na listę.<br>'
        +'<button class="ab" onclick="setMStab(\'cat\')">📚 Otwórz katalog</button></div>';
    }else{
      html+='<div class="kpis" style="grid-template-columns:1fr 1fr">'
        +'<div class="kpi"><span>Obserwowane modele</span><b>'+ms.length+'</b></div>'
        +'<div class="kpi"><span>Ich oferty</span><b>'+countWatchedOffers()+'</b><em>w bazie</em></div></div>';
      ms.forEach(function(m){
        const offs=modelOffers(m.id);const med=median(offs.map(function(o){return o.price;}));
        const cf2=cfg();
        const bins=[0,0,0,0,0];let lo=1e9,hi=0;
        offs.forEach(function(o){lo=Math.min(lo,o.price);hi=Math.max(hi,o.price);});
        if(offs.length&&hi>lo)offs.forEach(function(o){const i=Math.min(4,Math.floor((o.price-lo)/((hi-lo)/5)));bins[i]++;});
        const mx=Math.max.apply(null,bins.concat([1]));
        html+='<div class="pack" style="padding-bottom:10px"><div class="ph">'
          +'<div class="em">'+(m.fuel==='hybrid'?'🔋':'⛽')+'</div>'
          +'<div class="nm"><b>'+esc(m.short||m.name)+'</b><span>'+num1(m.l100)+' l · '+zl2(zl100Model(m,true,cf2))+'/100 km · '+stars(m.rel||0)+'</span></div>'
          +'<button class="btn-add" onclick="showModelOffers(\''+m.id+'\')">'+offs.length+' →</button></div>'
          +'<div class="conf" style="padding:0 12px"><span><b>'+offs.length+'</b> ofert</span><span>mediana <b>'+(med?fmt(med):'—')+'</b></span>'
          +'<span>najtaniej <b>'+(offs.length?fmt(Math.min.apply(null,offs.map(function(o){return o.price;}))):'—')+'</b></span></div>'
          +'<div style="display:flex;gap:3px;padding:8px 12px 0;align-items:flex-end;height:44px">'
          +bins.map(function(v){return '<i style="flex:1;background:'+(v?'#60a5fa':'#e2e8f0')+';height:'+(v?Math.max(12,Math.round(v/mx*100)):6)+'%;border-radius:3px 3px 0 0"></i>';}).join('')
          +'</div></div>';
      });
      html+='<div class="pack"><div class="ph" onclick="setMStab(\'cat\')"><div class="em">🧩</div>'
        +'<div class="nm"><b>Dodaj kolejne</b><span>Przejdź do katalogu albo dodaj własny model</span></div>'
        +'<button class="btn-add">📚 Katalog</button></div></div>';
    }
  }
  box.innerHTML=html;
}
function toggleModel(id){
  const f=ST.filters;f.models=f.models||[];
  const i=f.models.indexOf(id);
  if(i>-1)f.models.splice(i,1);else f.models.push(id);
  save();render();
}
function countSrc(k){
  try{return applyFilters(tabBase(true),ST.filters,cfg(),Date.now()).filter(function(o){return sourceOf(o)===k;}).length;}
  catch(e){return 0;}
}
function modelIsOn(id){const ms=ST.filters.models||[];return !ms.length||ms.indexOf(id)>-1;}
function toggleWatchModel(id){
  ST.watchModels=ST.watchModels||[];
  const i=ST.watchModels.indexOf(id);
  if(i>-1)ST.watchModels.splice(i,1);else ST.watchModels.push(id);
  save();render();scheduleSync();
  const mo=modelById(id),nm=mo?esc(mo.short||mo.name):'';
  toast(i>-1?('Usunięto z obserwowanych: '+nm):('⭐ Obserwujesz model: <b>'+nm+'</b> — jego oferty są na liście.'));
}
function setMStab(v){MSTAB=v;save();render();}
function setPack(v){QPACK=(QPACK===v?'':v);render();}
function setQModel(v){QMODEL=v;
  clearTimeout(setQModel._t);setQModel._t=setTimeout(function(){render();},220);}
function addPack(id){
  const p=PACKS.filter(function(x){return x.id===id;})[0];if(!p)return;
  const ms=packModels(p).map(function(m){return m.id;});
  const allOn=ms.every(function(id){return isWatchModel(id);});
  ST.watchModels=ST.watchModels||[];
  if(allOn)ST.watchModels=ST.watchModels.filter(function(id){return ms.indexOf(id)<0;});
  else ms.forEach(function(id){if(!isWatchModel(id))ST.watchModels.push(id);});
  save();render();scheduleSync();
  toast((allOn?'Usunięto z obserwowanych: ':'Obserwujesz: ')+ms.length+' modeli ('+p.name+')');
}
function showModelOffers(id){
  const m=modelById(id);if(!m)return;
  ST.filters.models=[id];ST.filters.watchOnly=false;
  if(m.fuel!=='hybrid'&&m.lpg!=='nie')ST.filters.fuel='any';
  save();VIEW='offers';TAB='all';render();window.scrollTo({top:0,behavior:'smooth'});
  toast('Filtr: '+esc(m.name)+' — pokazuję tylko ten model.');
}

function cmPick(k,v){
  const box=el(k==='fuel'?'cmFuel':'cmRel');
  if(!box)return;
  Array.prototype.forEach.call(box.children,function(c){c.classList.toggle('on',c.getAttribute('data-v')===String(v));});
}
function closeModal(){const w=el('modalWrap');if(w)w.innerHTML='';}
function saveCustomModel(id){

/* ---------- RYNEK ---------- */
function marketEvents(){
  const ev=[];
  offersArr().forEach(function(o){
    const nm=esc(miOf(o).short||miOf(o).name);
    if(o.first_seen)ev.push({t:new Date(o.first_seen).getTime(),c:'#10b981',txt:'<b>'+nm+'</b> — nowa oferta za <b>'+fmt(o.price)+'</b>'+(o.city?(', '+esc(o.city)):''),id:o.id});
    if(o.prev_price&&o.prev_price>o.price)ev.push({t:new Date(o.last_seen||o.first_seen||0).getTime(),c:'#f59e0b',txt:'<b>'+nm+'</b> — cena spadła o <b>'+fmt(o.prev_price-o.price)+'</b> → '+fmt(o.price),id:o.id});
    if(o.prev_price&&o.price>o.prev_price)ev.push({t:new Date(o.last_seen||o.first_seen||0).getTime(),c:'#ef4444',txt:'<b>'+nm+'</b> — cena wzrosła o <b>'+fmt(o.price-o.prev_price)+'</b>',id:o.id});
    if(o.missing_since)ev.push({t:new Date(o.missing_since).getTime(),c:'#94a3b8',txt:'<b>'+nm+'</b> — ogłoszenie zniknęło z portalu',id:o.id});
  });
  ev.sort(function(a,b){return b.t-a.t;});
  return ev.slice(0,40);
}
function renderMarket(){
  const box=el('view');if(!box)return;
  const all=offersArr().filter(function(o){return !isDis(o.id);});
  const watched=all.filter(function(o){return (ST.watchModels||[]).indexOf(miOf(o).id)>-1;});
  const pool=watched.length?watched:all;
  const now=Date.now();
  const new24=pool.filter(function(o){return o.first_seen&&(now-new Date(o.first_seen).getTime()<864e5);}).length;
  const drops=pool.filter(function(o){return o.prev_price&&o.prev_price>o.price;});
  const dropSum=drops.reduce(function(a,o){return a+(o.prev_price-o.price);},0);
  const inBud=pool.filter(function(o){return kosztOf(o.price,o.lpg,cfg(),miOf(o).lpgCost).koszt<=40000;}).length;
  const deals=pool.filter(isDeal);
  const ev=marketEvents();
  let html='<div class="kpis">'
    +'<div class="kpi"><span>Nowe 24 h</span><b>'+new24+'</b><em>w '+(watched.length?'obserwowanych':'bazie')+'</em></div>'
    +'<div class="kpi"><span>Spadki cen</span><b>'+drops.length+'</b><em>'+(dropSum?('−'+nf(dropSum)+' zł razem'):'brak')+'</em></div>'
    +'<div class="kpi"><span>W budżecie 40 tys.</span><b>'+inBud+'</b><em>z '+pool.length+'</em></div>'
    +'<div class="kpi"><span>Okazje</span><b>'+deals.length+'</b><em class="up">≥8% pod medianą</em></div>'
    +'</div>';
  html+='<div class="sect">Dziennik zmian</div><div class="timeline">';
  if(!ev.length)html+='<div class="trow"><div class="txt">Brak zdarzeń — poczekaj na kolejne pobranie.</div></div>';
  else html+=ev.map(function(e){
    return '<div class="trow" onclick="gotoOffer(\''+e.id+'\')"><span class="dot" style="background:'+e.c+'"></span>'
      +'<div class="txt">'+e.txt.replace(' — ',' · ')+'</div><span class="tm">'+whenTxt(e.t)+'</span></div>';
  }).join('');
  html+='</div>';
  html+='<div class="sect">Ceny paliw <button onclick="setFuelPrices()">zmień →</button></div>'
    +'<div class="opts"><span class="opt">Pb95 '+zl2(cfg().pb)+' zł</span><span class="opt">LPG '+zl2(cfg().lpgP)+' zł</span>'
    +'<span class="opt" onclick="setFuelPrices()">✏️ edytuj</span></div>';
  html+='<div class="sect">Najlepsze okazje</div>';
  const top=pool.filter(isDeal).sort(function(a,b){return dealPct(b)-dealPct(a);}).slice(0,5);
  if(!top.length)html+='<div class="empt">Za mało ofert w modelu, żeby policzyć medianę (potrzeba min. 5).</div>';
  else html+=top.map(function(o){
    return '<div class="pack"><div class="ph" onclick="gotoOffer(\''+o.id+'\')"><div class="em">🎯</div>'
      +'<div class="nm"><b class="c2">'+esc(o.title)+'</b><span>'+fmt(o.price)+' · mediana '+fmt(dealFor(o).med)+' · '+Math.round(dealPct(o)*100)+'% taniej</span></div>'
      +'<button class="btn-add">→</button></div></div>';
  }).join('');
  box.innerHTML=html;
}
function whenTxt(t){
  const d=Date.now()-t;
  if(d<36e5)return Math.max(1,Math.round(d/6e4))+' min';
  if(d<864e5)return Math.round(d/36e5)+' h';
  if(d<6048e5)return Math.round(d/864e5)+' dni';
  return d2(new Date(t).toISOString());
}
function gotoOffer(id){
  const o=ST.db.offers[id];if(!o)return;

    if(c){c.scrollIntoView({block:'center',behavior:'smooth'});c.style.boxShadow='0 0 0 3px #1d4ed8';setTimeout(function(){c.style.boxShadow='';},1800);}
  },120);
}

      +yearList().map(function(y){return '<option value="'+y+'"'+((+f.yearFrom||0)===y?' selected':'')+'>od '+y+'</option>';}).join('')+'</select>'
      +'<select class="sel" style="flex:1" onchange="setYearF(\'yearTo\',this.value)"><option value="">dowolny</option>'
      +yearList().map(function(y){return '<option value="'+y+'"'+((+f.yearTo||0)===y?' selected':'')+'>do '+y+'</option>';}).join('')+'</select></div>'
    +'<div class="sect">Przebieg do</div><select class="sel" style="width:100%" onchange="setMilF(this.value)">'
      +'<option value="">dowolny</option>'+[100000,150000,200000,250000,300000,350000,400000].map(function(v){
        return '<option value="'+v+'"'+((+f.milMax||0)===v?' selected':'')+'>do '+nf(v)+' km</option>';}).join('')+'</select>'
    +'<div class="sect">Odległość od Katowic</div><select class="sel" style="width:100%" onchange="setDistF(this.value)">'
      +'<option value="">cała Polska</option>'+[50,100,200,400].map(function(v){
        return '<option value="'+v+'"'+((+f.dist||0)===v?' selected':'')+'>do '+v+' km</option>';}).join('')+'</select>'
    +'<div class="sect">Tylko</div><div class="opts">'
      +[['hideSusp','⚠️ sensowny przebieg'],['hideShort','⏳ dłużej niż kredyt 60 mc'],['hideNoLpg','💰 w budżecie po LPG'],['showNear','➕ tuż nad budżetem']].map(function(x){
        return '<span class="opt'+(f[x[0]]?' on':'')+'" onclick="toggleFS(\''+x[0]+'\')">'+x[1]+'</span>';}).join('')
      +'<span class="opt'+(f.dealsOnly?' on':'')+'" onclick="toggleFS(\'dealsOnly\')">🎯 tylko okazje</span>'
    +'</div></div>'
    +'<div class="sf"><button class="ab" style="flex:1;flex-direction:row" onclick="clearFiltersNow()">↺ Wyczyść</button>'
    +'<button class="ab pri" style="flex:2;flex-direction:row;gap:6px;font-size:13px" onclick="openSheet();render()">✓ Pokaż '+filtCount({})+' ofert</button></div>'
    +'</div></div>';
  w.innerHTML=html;
}
function yearList(){
  const yb=yearBounds();const out=[];
  for(let y=yb[1];y>=yb[0];y--)out.push(y);
  return out;
}

/* ---------- PORÓWNANIE ---------- */
function addCmp(id){
  const i=CMP.indexOf(id);
  if(i>-1)CMP.splice(i,1);
  else{if(CMP.length>=4){toast('Możesz porównać maksymalnie 4 oferty.');return;}CMP.push(id);}
  save();render();
  if(CMP.length>=2)openCmp();
}
function openCmp(){
  const list=CMP.map(function(id){return ST.db.offers[id];}).filter(Boolean);
  if(list.length<2){toast('Dodaj co najmniej 2 oferty (przycisk ⚖️ Porównaj na karcie).');return;}
  const cf=cfg();
  const rows=[
    ['Cena',function(o){return fmt(o.price);},function(o){return -o.price;}],
    ['Koszt całkowity',function(o){return '<b>'+fmt(kosztOf(o.price,o.lpg,cf,miOf(o).lpgCost).koszt)+'</b>';},function(o){return -kosztOf(o.price,o.lpg,cf,miOf(o).lpgCost).koszt;}],
    ['Rata 60 mc',function(o){return fmt(kosztOf(o.price,o.lpg,cf,miOf(o).lpgCost).r60[0]);},function(o){return -kosztOf(o.price,o.lpg,cf,miOf(o).lpgCost).r60[0];}],
    ['zł/100 km',function(o){return '<b>'+zl2(zl100Of(o,cf))+'</b>';},function(o){return -zl100Of(o,cf);}],
    ['Spalanie',function(o){return num1(l100Of(o))+' l';},function(o){return -l100Of(o);}],
    ['Rocznik',function(o){return o.year||'—';},function(o){return +(o.year||0);}],
    ['Przebieg',function(o){return nf(o.mileage)+' km';},function(o){return -(o.mileage||0);}],
    ['LPG',function(o){return o.lpg?'w cenie':('+'+fmt(miOf(o).lpgCost));},null],
    ['Model',function(o){return esc(miOf(o).short);},function(o){return -(miOf(o).rel||0);}],
    ['Bezawaryjność',function(o){return stars(miOf(o).rel||0);},function(o){return miOf(o).rel||0;}],
    ['Bagażnik',function(o){return (miOf(o).boot||'—')+' l';},function(o){return miOf(o).boot||0;}],
    ['Lokalizacja',function(o){return esc(o.city||'—')+(o.dist_km!=null?' ('+o.dist_km+' km)':'');},function(o){return -(o.dist_km==null?999:o.dist_km);}],
    ['Ryzyko modelu',function(o){return '<span class="cm">'+esc(miOf(o).risk||'—')+'</span>';},null]
  ];
  const best={};
  rows.forEach(function(r,i){
    if(!r[2])return;
    let bi=0,bv=-1e18;
    list.forEach(function(o,j){const v=r[2](o);if(v>bv){bv=v;bi=j;}});
    best[i]=bi;
  });
  const head='<tr><th>Parametr</th>'+list.map(function(o){
    return '<th><a href="'+esc(o.url)+'" target="_blank" rel="noopener" style="color:#1d4ed8;text-decoration:none">'+esc((o.title||'').slice(0,32))+'</a></th>';}).join('')+'</tr>';
  const body=rows.map(function(r,i){
    return '<tr><th>'+r[0]+'</th>'+list.map(function(o,j){
      return '<td class="'+(best[i]===j?'win':'')+'">'+r[1](o)+'</td>';}).join('')+'</tr>';
  }).join('');
  const w=el('modalWrap');
  w.innerHTML='<div class="modal" onclick="if(event.target===this)closeCmp()"><div class="box">'
    +'<div class="sh" style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b style="flex:1;font-size:15px;white-space:nowrap">⚖️ Porównanie <span class="cb">'+list.length+'</span></b>'
    +'<button class="ab" style="flex:0 0 auto;padding:6px 10px" onclick="copyCmp()">📋 Kopiuj</button>'
    +'<button class="ab" style="flex:0 0 auto;padding:6px 10px" onclick="CMP=[];closeCmp();render()">🗑 Wyczyść</button>'
    +'<button class="ab" style="flex:0 0 auto;padding:6px 10px" onclick="closeCmp()">✕</button></div>'
    +'<div class="cmp" style="overflow:auto"><table>'+head+body+'</table></div>'
    +'<p class="cm" style="margin-top:8px">Zielone = najlepsza wartość w wierszu. Przesuń tabelę w bok, żeby zobaczyć pozostałe.</p>'
    +'</div></div>';
}
function closeCmp(){const w=el('modalWrap');if(w&&w.innerHTML.indexOf('Porównanie')>-1)w.innerHTML='';}
function copyCmp(){
  const list=CMP.map(function(id){return ST.db.offers[id];}).filter(Boolean);
  const cf=cfg();
  const txt=list.map(function(o){
    const c=kosztOf(o.price,o.lpg,cf,miOf(o).lpgCost);
    return '• '+o.title+' ('+o.year+', '+nf(o.mileage)+' km)\n  cena '+fmt(o.price)+', razem '+fmt(c.koszt)+', '+zl2(zl100Of(o,cf))+'/100 km\n  '+o.url;
  }).join('\n');
  try{navigator.clipboard.writeText(txt);toast('Skopiowane do schowka.');}catch(e){toast('Nie udało się skopiować.',{err:1});}
}

/* ---------- swipe + long-press ---------- */
const G={on:false,x:0,y:0,dx:0,card:null,sw:null,id:null,mode:null,lp:null,just:0};
function gestureStart(e){
  if(e.button>0)return;
  const t=e.target;if(!t||!t.closest)return;
  if(t.closest('a,button,select,input,textarea,summary,details'))return;
  const card=t.closest('.card');if(!card)return;
  G.on=true;G.x=e.clientX;G.y=e.clientY;G.dx=0;G.card=card;G.sw=card.closest('.sw');
  G.id=card.getAttribute('data-id');G.mode=null;
  clearTimeout(G.lp);
  G.lp=setTimeout(function(){
    if(!G.on||G.mode)return;
    G.mode='lp';G.just=Date.now();
    if(navigator.vibrate)try{navigator.vibrate(18);}catch(_){}
    if(!SELM){selMode(true);}
    toggleSel(G.id);
  },480);
}
function gestureMove(e){
  if(!G.on)return;
  const dx=e.clientX-G.x,dy=e.clientY-G.y;
  if(!G.mode){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    if(Math.abs(dx)<Math.abs(dy)*1.2){G.on=false;clearTimeout(G.lp);return;}
    G.mode='sw';clearTimeout(G.lp);
    if(G.card)G.card.style.transition='none';
  }
  if(G.mode!=='sw')return;
  G.dx=dx;
  G.card.style.transform='translateX('+dx+'px)';
  if(G.sw){G.sw.querySelector('.swbg.l').style.opacity=dx<-10?1:.85;G.sw.querySelector('.swbg.r').style.opacity=dx>10?1:.85;}
  if(e.cancelable)e.preventDefault();
}
function gestureEnd(){
  clearTimeout(G.lp);
  if(!G.on){return;}
  G.on=false;
  if(G.mode!=='sw'){G.mode=null;return;}
  const c=G.card,id=G.id,dx=G.dx;
  c.style.transition='transform .16s';
  const th=Math.min(Math.max((c.offsetWidth||340)*0.28,70),150);
  G.just=Date.now();
  if(dx<-th){c.style.transform='translateX(-105%)';setTimeout(function(){swAct(id,'rej');},130);}
  else if(dx>th){c.style.transform='translateX(105%)';setTimeout(function(){swAct(id,'fav');},130);}
  else{c.style.transform='';}
  G.mode=null;G.dx=0;
}
function swAct(id,kind){
  if(!ST.db.offers[id]){render();return;}
  if(kind==='rej'){if(isDis(id)){toast('Już odrzucona.');render();return;}askReject(id);toast('Wybierz powód odrzucenia 👇');}
  else{if(isFav(id)){toast('Już w ulubionych.');render();return;}toggleFav(id);toast('★ Dodano do ulubionych.',{act:'toggleFav(\''+id+'\')',label:'↩ Cofnij'});}
}
function bindGestures(){
  const v=el('view');if(!v||!v.addEventListener)return;
  v.addEventListener('pointerdown',gestureStart);
  v.addEventListener('pointermove',gestureMove);
  v.addEventListener('pointerup',gestureEnd);
  v.addEventListener('pointercancel',gestureEnd);
  v.addEventListener('click',function(e){
    if(Date.now()-G.just<320){e.preventDefault();e.stopPropagation();G.just=0;return;}
    if(SELM){const c=e.target.closest&&e.target.closest('.card');
      if(c&&!e.target.closest('a,button')){toggleSel(c.getAttribute('data-id'));}
    }
  },true);
}

function setTab(t){TAB=t;OPEN={};save();render();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- counts / tabs engine ---------- */
function counts(){
  const c={total:0,all:0,neu:0,chg:0,deal:0,fav:0,con:0,dis:0,watch:0};
  const f=ST.filters;
  for(const o of offersArr()){
    c.total++;
    if(isDis(o.id)){c.dis++;continue;}
    c.all++;
    const s=statusOf(o,ST);
    if(s.isNew)c.neu++;
    if(s.drop>0||s.rise>0)c.chg++;
    if(isDeal(o))c.deal++;
    if(isFav(o.id))c.fav++;
    if(isCon(o.id))c.con++;
    if((ST.watchModels||[]).indexOf(miOf(o).id)>-1)c.watch++;
  }
  return c;
}
function tabBase(ignoreSrc){
  let list=ignoreSrc?Object.keys(ST.db.offers).map(function(k){return ST.db.offers[k];}):offersArr();
  if(ST.filters.watchOnly&&(ST.watchModels||[]).length){
    const w=ST.watchModels||[];
    list=list.filter(function(o){return w.indexOf(miOf(o).id)>-1;});
  }
  if(TAB==='dis')list=list.filter(function(o){return isDis(o.id);});
  else{
    list=list.filter(function(o){return !isDis(o.id);});
    if(TAB==='fav')list=list.filter(function(o){return isFav(o.id);});
    if(TAB==='con')list=list.filter(function(o){return isCon(o.id);});
    if(TAB==='new')list=list.filter(function(o){return statusOf(o,ST).isNew;});
    if(TAB==='price')list=list.filter(function(o){const s=statusOf(o,ST);return s.drop>0||s.rise>0;});
    if(TAB==='deal')list=list.filter(isDeal);
  }
  return list;
}
function listNow(){
  DEALC={};
  const l=applyFilters(tabBase(),ST.filters,cfg(),Date.now());
  if(ST.filters.dealsOnly)return l.filter(isDeal);
  return l;
}
