<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Znajdź taksówkę — hybrydy na Uber/Bolt</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#f1f5f9;--card:#fff;--ink:#1e293b;--mut:#64748b;--brd:#e2e8f0;--acc:#1d4ed8;--ok:#059669;--bad:#dc2626;--warn:#b45309;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-bottom:40px;}
  header{position:sticky;top:0;z-index:30;background:#0f172a;color:#fff;padding:10px 12px 0;box-shadow:0 2px 8px rgba(2,6,23,.25);}
  .hrow{display:flex;align-items:center;gap:8px;}
  h1{font-size:16px;margin:0;flex:1;font-weight:700;white-space:nowrap;}
  .ver{font-size:11px;font-weight:800;color:#475569;background:#e2e8f0;border-radius:999px;padding:3px 8px;white-space:nowrap;}
  .btn{border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .status{font-size:11px;color:#94a3b8;margin:6px 0 8px;}
  .status b{color:#e2e8f0;}
  .tabs{display:flex;gap:4px;overflow-x:auto;}
  .tab{flex:0 0 auto;padding:9px 12px;border-radius:9px 9px 0 0;background:#1e293b;color:#cbd5e1;font-size:13px;font-weight:600;cursor:pointer;border:0;white-space:nowrap;}
  .tab.on{background:var(--bg);color:#0f172a;}
  .tab .b{display:inline-block;background:#0f172a;color:#fff;border-radius:20px;font-size:11px;padding:0 6px;margin-left:5px;}
  .tab.on .b{background:var(--acc);}
  .wrap{max-width:840px;margin:0 auto;padding:10px 10px 0;}
  .card{background:var(--card);border:1px solid var(--brd);border-radius:13px;padding:10px;margin:10px 0;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .of{display:grid;grid-template-columns:104px 1fr;gap:10px;}
  .of>div{min-width:0;}
  .card{overflow-wrap:anywhere;}
  .of img{width:104px;height:78px;object-fit:cover;border-radius:9px;background:#e2e8f0;}
  .ttl{font-weight:700;font-size:13.5px;margin:0 0 4px;overflow-wrap:anywhere;word-break:break-word;}
  .badges{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 5px;}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;}
  .pNew{background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .pDrop{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}
  .pLpg{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc;}
  .pIn{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;}
  .pNear{background:#fffbeb;color:#b45309;border:1px solid #fde68a;}
  .pOut{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;}
  .pGone{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
  .pFav{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
  .pOk{background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .pWar{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}
  .pBad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
  .pCon{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc;}
  .pRej{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
  .pSrcOto{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;letter-spacing:.3px;}
  .pSrcOlx{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc;letter-spacing:.3px;}
  .meta{font-size:12px;color:var(--mut);overflow-wrap:anywhere;}
  .price{font-size:17px;font-weight:800;margin:2px 0 1px;}
  .price small{font-size:11.5px;font-weight:600;color:var(--mut);}
  details.cost{margin-top:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:6px 8px;font-size:12.5px;}
  details.cost>summary{cursor:pointer;list-style:none;}
  details.cost>summary::-webkit-details-marker{display:none;}
  details.cost>summary::before{content:"▸ ";color:#1d4ed8;}
  details.cost[open]>summary::before{content:"▾ ";}
  details.cost b{color:#1d4ed8;}
  details.cost table{margin-top:6px;background:#fff;}
  details.cost td,details.cost th{border:1px solid #dbeafe;padding:4px 6px;font-size:12px;}
  details.cost th{background:#eff6ff;color:#1e3a8a;}
  .hint{font-size:11px;color:#64748b;font-weight:600;}
  .rates2{margin-top:6px;}
  .rates2{overflow-x:auto;}
  .rates2 table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;background:#fff;table-layout:fixed;}
  .rates2 th,.rates2 td{border:1px solid #dbeafe;padding:4px 6px;text-align:right;overflow-wrap:anywhere;}
  .rates2 th:first-child,.rates2 td:first-child{text-align:left;background:#f8fafc;color:#1e293b;font-weight:700;width:34%;}
  .rates2 thead th{background:#eff6ff;color:#1e3a8a;font-size:11px;text-align:right;}
  .rates2 thead th:first-child{text-align:left;color:#1e3a8a;}
  .rates2 td b{color:#1d4ed8;font-size:13px;}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .ab{border:1px solid var(--brd);background:#f8fafc;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#0f172a;text-decoration:none;display:inline-block;}
  .ab.on{background:#fef3c7;border-color:#fcd34d;color:#92400e;}
  .ab.onCon{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3;}
  .ab.dg.on{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
  .ab.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
  .ab.sm{padding:4px 8px;font-size:11.5px;}
  details.f{background:#fff;border:1px solid var(--brd);border-radius:12px;margin:10px 0;}
  details.f>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px;list-style:none;}
  details.f>summary::before{content:"▸ ";color:var(--acc);}
  details.f[open]>summary::before{content:"▾ ";}
  details.f .in{padding:0 12px 12px;}
  label{font-size:12px;font-weight:600;display:block;margin:8px 0 2px;}
  select,input[type=number],input[type=text],textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .qbar{background:#fff;border:1px solid var(--brd);border-radius:13px;padding:9px 10px 10px;margin:10px 0 8px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .qbar .chips{margin:0;}
  .qbar .chip{padding:6px 12px;font-size:12.5px;}
  .bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:#fff;
    border-top:1px solid var(--brd);box-shadow:0 -6px 20px rgba(15,23,42,.14);
    padding:8px 10px;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .bulkbar.on{display:flex;}
  .bulkbar select{font-size:12.5px;padding:6px 8px;border:1px solid var(--brd);border-radius:9px;background:#fff;}
  .bulkbar .ab{font-size:12.5px;padding:6px 10px;}
  .bulkbar b{font-size:13px;white-space:nowrap;}
  body.selmode #list{padding-bottom:110px;}
  .card .cbox{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:9px;
    border:2px solid #94a3b8;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;color:#fff;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .card{position:relative;}
  .card.onsel{outline:3px solid #2563eb;outline-offset:-2px;background:#eff6ff;}
  .card.onsel .cbox{background:#2563eb;border-color:#2563eb;}
  .q2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .qs{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .qs>span{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);}
  .qs select{width:100%;padding:7px 8px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);}
  .qs select:focus{outline:2px solid #bfdbfe;border-color:var(--acc);}
  .chip{border:1px solid #cbd5e1;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#334155;}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
  .chip .cnt{font-weight:600;opacity:.65;font-size:11px;margin-left:4px;}
  .chip.on .cnt{opacity:.9;}
  .chip.off{opacity:.4;cursor:default;text-decoration:line-through;}
  .chip.r.on{background:#dc2626;border-color:#dc2626;}
  .log{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#475569;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:9px;padding:8px;margin-top:8px;max-height:150px;overflow:auto;white-space:pre-wrap;}
  .small{font-size:11.5px;color:var(--mut);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{border:1px solid var(--brd);padding:6px 7px;text-align:left;vertical-align:top;}
  th{background:#0f172a;color:#fff;font-size:11.5px;}
  td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  a{color:var(--acc);}
  .empt{text-align:center;color:var(--mut);padding:30px 10px;font-size:13px;}
  .spin{width:14px;height:14px;border:2px solid #94a3b8;border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .hide{display:none !important;}
  .secT{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#475569;margin:14px 0 4px;}
  .notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 12px;font-size:12.5px;margin:8px 0;}
  .toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:100;padding:10px 10px 16px;}
  .toast .toastIn{display:none;background:#0f172a;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;
    box-shadow:0 10px 30px rgba(2,6,23,.45);align-items:center;gap:10px;flex-wrap:wrap;max-width:min(720px,94vw);pointer-events:auto;}
  .toast.on .toastIn{display:flex;}
  .toast .ab{background:#fff;border-color:#fff;color:#0f172a;}
  .toast .x{background:transparent;border:1px solid #475569;color:#cbd5e1;border-radius:8px;padding:2px 7px;cursor:pointer;font-weight:700;}
  .ab[disabled]{opacity:.65;cursor:default;}
  .spin2{width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:#1d4ed8;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-1px;}
  .chkline{font-size:11.5px;margin-top:3px;padding:3px 7px;border-radius:7px;display:inline-block;}
  .chkA{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
  .chkG{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
  .chkU{background:#f8fafc;color:#475569;border:1px solid #cbd5e1;}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🚕 Znajdź taksówkę</h1>
    <span class="ver" id="ver">v5.1</span>
    <button class="btn" id="btnRefresh" onclick="liveRefresh()">🔄 Odśwież</button>
  </div>
  <div class="status" id="status">ładowanie…</div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="wrap">

  <div class="qbar" id="qbar">
    <div class="chips" id="chSrc"></div>
    <div class="q2">
      <label class="qs"><span>Sortowanie</span>
        <select id="fSort" onchange="readFilters()">
          <option value="koszt">Koszt — od najniższego</option>
          <option value="r60">Rata 60 mc — od najniższej</option>
          <option value="r48">Rata 48 mc — od najniższej</option>
          <option value="new">Najnowsze ogłoszenia</option>
          <option value="year">Rocznik — od najmłodszego</option>
          <option value="mil">Przebieg — od najniższego</option>
          <option value="dist">Odległość od Katowic</option>
        </select>
      </label>
      <label class="qs"><span>Maks. koszt całkowity</span>
        <select id="fBud" onchange="readFilters()"></select>
      </label>
      <button class="ab" id="btnSel" onclick="selMode()" style="align-self:end;margin-bottom:1px;">☑️ Zaznaczanie</button>
    </div>
  </div>

  <details class="f" id="filtersBox">
    <summary>🎛️ Więcej filtrów</summary>
    <div class="in">
      <div class="secT">Data wystawienia ogłoszenia</div>
      <div class="chips" id="chDate"></div>

      <div class="secT">Model <span style="font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;color:#64748b;">— liczba = ile jest ofert</span></div>
      <div class="chips" id="chModels"></div>

      <div class="secT">Napęd / LPG</div>
      <div class="chips" id="chLpg"></div>

      <div class="secT">Sprzedający</div>
      <div class="chips" id="chSeller"></div>

      <div class="secT">Rocznik</div>
      <div class="grid2">
        <select id="fYearFrom" onchange="readFilters()"></select>
        <select id="fYearTo" onchange="readFilters()"></select>
      </div>

      <div class="secT">Przebieg</div>
      <select id="fMil" onchange="readFilters()">
        <option value="">dowolny</option>
        <option value="100000">do 100 tys. km</option>
        <option value="150000">do 150 tys. km</option>
        <option value="200000">do 200 tys. km</option>
        <option value="250000">do 250 tys. km</option>
        <option value="300000">do 300 tys. km</option>
        <option value="350000">do 350 tys. km</option>
        <option value="400000">do 400 tys. km</option>
      </select>

      <div class="secT">Odległość od Katowic</div>
      <select id="fDist" onchange="readFilters()">
        <option value="">cała Polska</option>
        <option value="50">do 50 km</option>
        <option value="100">do 100 km</option>
        <option value="200">do 200 km</option>
        <option value="400">do 400 km</option>
      </select>

      <div class="secT">Dodatkowe filtry</div>
      <p class="small" style="margin:0 0 4px;">Możesz zaznaczyć kilka naraz. Plakietki bez ofert są wyszarzone.</p>
      <div class="chips" id="chExtra"></div>

      <div class="row"><button class="ab" onclick="resetFilters()">Wyczyść filtry</button></div>
    </div>
  </details>

  <div id="list"></div>
  <div class="bulkbar" id="bulkbar"></div>
  <div id="infoCard"></div>
</div>

<script id="core-js">
/* ===== CORE — czysta logika (bez przeglądarki, testowalna) ===== */
const KAT=[50.2649,19.0238];
function haversine(lat,lon){const R=6371,p1=KAT[0]*Math.PI/180,p2=lat*Math.PI/180,dp=p2-p1,dl=(lon-KAT[1])*Math.PI/180;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(a)));}
function numFrom(s){if(s===null||s===undefined)return null;const m=String(s).replace(/\u00a0/g,' ').match(/(\d[\d\s]{2,})/);return m?parseInt(m[1].replace(/\s/g,''),10):null;}
const RE_BAD=/uszkodz|na cz[eę][śs]ci|cz[eę][śs]ci|anglik|rozbity|powypadkowy|silnik na sprzeda|skrzynia na sprzeda|katalizator|felgi|opony|zderzak|reflektor|zaczep/i;
const RE_HYB=/hybryd|hsd|hybrid|prius/i;
const RE_LPG=/\blpg\b|\bgpl\b|\bgaz\b|gazie|gazowa|gazowy|prins|brc|stag|lovato|tartarini/i;
function param(o,k){for(const p of (o.params||[])){if(p.key===k){let v=p.value;if(v&&typeof v==='object')return v.label??v.key??v.value;return v;}}return null;}
function modelOf(title,desc,hint){const b=(title+' '+(desc||''));
  if(/prius\s*\+|prius plus|prius\+/i.test(b))return'Prius+';
  if(/lexus/i.test(b))return'Lexus CT';
  if(/plug-?in|phev/i.test(b))return'Prius Plug-in';
  if(/prius/i.test(b))return'Prius';
  if(/auris/i.test(b))return'Auris Hybrid';
  return hint||'Hybryda';}

/* --- koszt całkowity: cena + LPG + formalności taxi (z ubezpieczeniem OC) --- */
const BASE_PARTS=[
  ['Ubezpieczenie OC taxi (1. rok)',3000],
  ['Pakiet startowy serwisowy (oleje, filtry, płyny)',1000],
  ['Badanie techniczne TAXI (149 zł okresowe + 64 zł taxi)',213],
  ['Rejestracja + wpis TAXI do dowodu (dowód, tablice, nalepki, pozwolenie)',160],
  ['Wyposażenie taxi: kogut, gaśnica, naklejki, zestaw naprawczy',280]
];
function baseSum(){return BASE_PARTS.reduce((a,x)=>a+x[1],0);}
function kosztOf(price,lpg,cf){
  cf=cf||{base:baseSum(),lpg:5000};
  const p=+price||0;
  const add=lpg?0:(+cf.lpg||0);
  const parts=[{n:'Cena auta',v:p},
    {n:lpg?'LPG — już w aucie':'Montaż LPG (instalacja + badanie + wpis)',v:add}];
  BASE_PARTS.forEach(x=>parts.push({n:x[0],v:x[1]}));
  const koszt=p+add+(+cf.base||baseSum());
  const m48=cf.m48||0.024952,m60=cf.m60||0.020793;
  return{koszt:koszt,price:p,lpgAdd:add,base:(+cf.base||baseSum()),parts:parts,
    r48:[Math.round(koszt*m48),Math.round((koszt+3000)*m48),Math.round((koszt+5000)*m48)],
    r60:[Math.round(koszt*m60),Math.round((koszt+3000)*m60),Math.round((koszt+5000)*m60)]};
}
/* --- do którego roku auto może jeździć (Bolt: 20 lat) --- */
function rokKoniec(o,cf){const y=o.year||0;return y?y+(cf&&cf.limit?cf.limit:20):null;}
function miesPracy(o,cf){
  /* pełne miesiące od dziś do 1 stycznia roku granicznego
     (październik 2026, rocznik 2011, limit 20 lat -> 1.01.2031 -> 51 mc) */
  const rk=rokKoniec(o,cf);if(rk==null)return null;
  const now=new Date();
  return Math.max(0,(rk-now.getFullYear())*12+(0-now.getMonth()));
}
function okresTxt(m){
  if(m==null)return '';
  const l=Math.floor(m/12),mm=m%12;
  let t='';
  if(l)t+=l+' '+odmLata(l);
  if(mm)t+=(t?' ':'')+mm+' mc';
  return t||'0 mc';
}
function lataPracy(o,cf){
  /* dziesiętne lata (4,3) — do „kosztu za rok pracy" */
  const m=miesPracy(o,cf);if(m==null)return null;
  return Math.round(m/12*10)/10;
}
function kosztNaRok(o,cf){
  const l=lataPracy(o,cf);if(l==null||l<=0)return null;
  const k=kosztOf(o.price,o.lpg,cf).koszt;return Math.round(k/l);
}
/* --- budżet --- */
function budgetOk(k,f){
  if(!f.budget)return true;
  const b=String(f.budget);
  if(b.charAt(b.length-1)==='+')return k>=parseFloat(b);
  return k<=parseFloat(b);
}
function budgetClass(k,f){
  if(!f.budget)return 'in';
  const b=String(f.budget);
  if(b.charAt(b.length-1)==='+')return k>=parseFloat(b)?'in':'out';
  const max=parseFloat(b);
  if(k<=max)return 'in';
  if(f.showNear!==false&&k<=max*1.2)return 'near';
  return 'out';
}
/* --- daty --- */
function dateWithin(iso,days,nowMs){
  if(!days||days>=900)return true;
  if(!iso)return false;
  const t=new Date(iso).getTime();if(isNaN(t))return false;
  return (nowMs-t)<=days*864e5;
}
/* --- statusy --- */
function stamp(prev,incoming,now){
  const o=Object.assign({},incoming);
  o.first_seen=(prev&&prev.first_seen)?prev.first_seen:now;
  o.last_seen=now;o.missing_since=null;
  if(prev&&typeof prev.price==='number'&&prev.price!==o.price)o.prev_price=prev.price;
  else o.prev_price=(prev&&prev.prev_price)||null;
  return o;
}
function mergeOffers(dbOffers,incoming,now){
  const out=Object.assign({},dbOffers),seen=new Set();
  for(const inc of incoming){seen.add(inc.id);out[inc.id]=stamp(dbOffers[inc.id],inc,now);}
  for(const id in out){if(!seen.has(id)&&!out[id].missing_since)out[id].missing_since=now;}

function nowISO(){return new Date().toISOString();}

function migrateMap(m){
  const out={};
  for(const id in (m||{})){
    const v=m[id];
    if(v==null)continue;
    if(typeof v==='string')out[id]={t:v,on:true};
    else if(typeof v==='object')out[id]=Object.assign({on:true},v);
  }
  return out;
}
function fmt(n){return (n==null||isNaN(n))?'—':Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' zł';}

function sourceOf(o){return (o&&o.src==='OTOMOTO')?'otomoto':'olx';}

function seedInto(){
  const seed=(typeof SEED!=='undefined'&&SEED&&SEED.offers)?SEED.offers:[];
  let n=0;
  for(const o of seed){
    if(isDamaged(o)){DMG_N++;continue;}
    const k=ST.db.offers[o.id];
    if(!k||new Date(o.last_seen||0)>new Date(k.last_seen||0)){ST.db.offers[o.id]=o;n++;}
  }
  if(n&&!ST.lastRefresh.at&&SEED.generated_at){ST.lastRefresh.at=SEED.generated_at;ST.lastRefresh.source=SEED.source||'plik offers.json';}
  return n;
}
async function fetchURL(url,ms){
  ms=ms||14000;
  const c=new AbortController(),t=setTimeout(function(){c.abort();},ms);
  let th=null;
  try{
    const hard=new Promise(function(_,rej){th=setTimeout(function(){rej(new Error('przekroczony czas'));},ms+400);});
    const r=await Promise.race([fetch(url,{signal:c.signal}),hard]);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }finally{clearTimeout(t);if(th)clearTimeout(th);}
}
async function relayGet(target,relay,ms){
  const u=relay.u(target);if(!u)throw new Error('brak adresu');
  let txt=(await fetchURL(u,ms||15000)).trim();
  if(relay.w==='contents'){const j=JSON.parse(txt);txt=j.contents||'';}
  if(!txt.startsWith('{'))throw new Error('nie-JSON');
  return JSON.parse(txt);
}
function markStale(src,j){
  /* oferta, której nie ma w świeżym pliku, a była widziana PRZED jego wygenerowaniem,
     traktujemy jako znikniętą. Nowsze (np. z „Odśwież" na żywo) zostawiamy w spokoju. */
  const gen=j&&j.generated_at?new Date(j.generated_at).getTime():0;
  if(!gen)return 0;
  const ids={};(j.offers||[]).forEach(function(o){ids[o.id]=1;});
  let n=0;
  Object.keys(ST.db.offers).forEach(function(k){
    const o=ST.db.offers[k];
    if(!o||sourceOf(o)!==src||ids[k]||o.missing_since)return;
    if(new Date(o.last_seen||0).getTime()<gen){o.missing_since=nowISO();n++;}
  });
  return n;
}

    if(j.generated_at)ST.lastOto={at:j.generated_at,count:(j.offers||[]).length};
    markStale('otomoto',j);autoRejectGone();

}

async function liveRefresh(){

          for(const o of (d.data||[])){const p=parseOlx(o,'',c0);if(p)all.push(p);}

      }

  if(sourceOf(o)==='otomoto'){return checkOtomoto(id);}

  OPEN['chk_'+id]=true;render();
  toast('⏳ Sprawdzam ogłoszenie na OLX…',{ms:12000});
  const numId=String(id).replace('olx-','');
  const t0=Date.now();
  const relays=RELAYS.filter(function(R){return !(R.n==='worker'&&!ST.settings.worker);});
  const online=(typeof navigator==='undefined'||navigator.onLine!==false);
  let fellBack=false;
  try{
    if(online){
      for(let i=0;i<relays.length;i++){
        const R=relays[i];
        try{
          const d=await relayGet('https://www.olx.pl/api/v1/offers/'+numId+'/',R,3500);
          const dd=(d&&d.data)?d.data:d;
          const stat=(dd&&dd.status)?dd.status:'nieznany';
          const active=(stat==='active'||stat==='active_limited');
          const vt=((dd&&dd.valid_to_time)||o.valid_to||null);
          ST.checks=ST.checks||{};
          ST.checks[id]={at:nowISO(),st:active?'active':'gone',valid_to:vt,src:R.n};
          if(!active){o.missing_since=o.missing_since||nowISO();}
          save();OPEN['chk_'+id]=false;render();
          if(active){
            toast('✅ Ogłoszenie <b>AKTYWNE</b> — ważne do <b>'+d2(vt)+'</b> (sprawdzone: '+R.n+')',
              {act:"copyQ()",actLabel:'📋 Pytania',ms:30000});
          }else{
            toast('❌ Ogłoszenie <b>nie jest już aktywne</b> (status: '+stat+')',
              {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
          }
          return;
        }catch(e){}
        if(Date.now()-t0>9000)break;
      }
    }
    const exp=o.valid_to?new Date(o.valid_to).getTime():null;
    let st='unknown';
    if(exp){st=(exp<Date.now())?'gone':'likely';}
    ST.checks=ST.checks||{};
    ST.checks[id]={at:nowISO(),st:st,valid_to:o.valid_to||null,src:(online?'z danych (bez połączenia)':'z danych (offline)')};
    save();fellBack=true;
  }catch(err){
    toast('⚠️ Błąd podczas sprawdzania: '+esc((err&&err.message)||err),{ms:15000});
  }finally{
    OPEN['chk_'+id]=false;render();
  }
  if(fellBack){
    if((ST.checks[id]||{}).st==='gone'){
      toast('🕸️ Ogłoszenie wygląda na <b>nieaktualne</b> (dane: ważne do '+d2(o.valid_to)+')',
        {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
    }else{
      toast('🕰️ Nie udało się potwierdzić na żywo. Z danych: <b>ważne do '+d2(o.valid_to)+'</b>.',
        {act:"checkOffer('"+id+"')",actLabel:'🔁 Spróbuj ponownie',ms:30000});
    }
  }
}

function openOto(id){
  const o=ST.db.offers[id];
  if(o&&o.url)window.open(o.url,'_blank','noopener');
}
function otoParse(txt){
  const m=txt.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
  if(!m)throw new Error('brak danych ogłoszenia');
  const d=JSON.parse(m[1]);
  const ad=d&&d.props&&d.props.pageProps&&d.props.pageProps.advert;
  if(!ad)throw new Error('brak ogłoszenia w odpowiedzi');
  return ad;
}
async function checkOtomoto(id){
  const o=ST.db.offers[id];
  if(OPEN['chk_'+id])return;
  OPEN['chk_'+id]=true;render();
  toast('⏳ Sprawdzam ogłoszenie na OTOMOTO…',{ms:12000});
  const t0=Date.now();
  const tries=[{n:'direct',u:function(t){return t;}}].concat(
    RELAYS.filter(function(R){return !(R.n==='worker'&&!ST.settings.worker);}));
  try{
    if(o.url){
      for(let i=0;i<tries.length;i++){
        const R=tries[i];
        try{
          const u=R.u(o.url); if(!u)continue;
          const txt=await fetchURL(u,5000);
          const ad=otoParse(txt);
          const stat=ad.status?String(ad.status).toUpperCase():'ACTIVE';
          const active=(stat==='ACTIVE');
          ST.checks=ST.checks||{};
          ST.checks[id]={at:nowISO(),st:active?'active':'gone',valid_to:null,src:'otomoto.pl/'+R.n};
          if(active){o.missing_since=null;o.last_seen=nowISO();}
          else{o.missing_since=o.missing_since||nowISO();}
          save();render();
          if(active){
            toast('✅ Ogłoszenie <b>AKTYWNE</b> na OTOMOTO (status: '+esc(stat)+')',
              {act:'copyQ()',actLabel:'📋 Pytania',ms:30000});
          }else{
            toast('❌ Ogłoszenie <b>nie jest już aktywne</b> na OTOMOTO (status: '+esc(stat)+')',
              {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
          }
          return;
        }catch(e){}
        if(Date.now()-t0>14000)break;
      }
    }
    /* OTOMOTO blokuje zapytania z przeglądarki — mówimy wprost, kiedy robot
       ostatnio widział tę ofertę, zamiast udawać, że sprawdziliśmy na żywo */
    const ls=o.last_seen?new Date(o.last_seen):null;
    const hrs=(ls&&!isNaN(ls))?((Date.now()-ls.getTime())/36e5):null;
    const when=o.last_seen?d2(o.last_seen):'—';
    ST.checks=ST.checks||{};
    if(o.missing_since){
      ST.checks[id]={at:nowISO(),st:'gone',valid_to:null,src:'otomoto.json'};
      save();render();
      toast('❌ Robot nie widzi już tej oferty na OTOMOTO (od '+d2(o.missing_since)+') — najpewniej zniknęła.',
        {act:"rejectWith('"+id+"','nieaktualne')",actLabel:'🚫 Odrzuć',ms:0});
    }else if(hrs!=null&&hrs<48){
      ST.checks[id]={at:nowISO(),st:'likely',valid_to:null,src:'otomoto.json'};
      save();render();
      toast('✅ Robot widział tę ofertę <b>'+when+'</b> — na dziś jest aktualna. '
        +'<span class="small">(OTOMOTO blokuje sprawdzanie wprost z przeglądarki, więc korzystam z ostatniego przebiegu.)</span>',
        {act:"openOto('"+id+"')",actLabel:'🔗 Otwórz i zobacz',ms:30000});
    }else{
      ST.checks[id]={at:nowISO(),st:'unknown',valid_to:null,src:'otomoto.json'};
      save();render();
      toast('⚠️ Ostatnio widziana <b>'+when+'</b>'+(hrs!=null?(' ('+Math.round(hrs/24)+' dni temu)'):'')
        +' — mogła zniknąć. Otwórz ogłoszenie i zobacz sam.',
        {act:"openOto('"+id+"')",actLabel:'🔗 Otwórz',ms:20000});
    }
  }finally{
    OPEN['chk_'+id]=false;render();
  }
}

/* --- synchronizacja między urządzeniami: dwa publiczne schowki JSON, bez tokenów --- */
const SYNC_KEYS=['fav','con','dis'];
const STORE_A='https://api.restful-api.dev/objects/';
const STORE_B='https://kvdb.io/';
function mergeMaps(a,b){
  const out={};
  for(const id in (a||{}))out[id]=a[id];
  for(const id in (b||{})){
    const x=a&&a[id],y=b[id];
    if(!x){out[id]=y;continue;}
    const tx=new Date(x.t||0).getTime(),ty=new Date(y.t||0).getTime();
    out[id]=ty>=tx?y:x;                       /* wygrywa nowszy wpis — także „wyłączony" (on:false) */
  }
  return out;
}
function mergeSync(local,remote){
  const out=Object.assign({},local);
  for(const k of SYNC_KEYS)out[k]=mergeMaps(local[k],remote[k]);
  return out;
}
function syncCfg(){
  const S=Object.assign({},SYNC_DEF,ST.settings.sync||{});
  if(!S.rid)S.rid=SYNC_DEF.rid;
  if(!S.kvbin)S.kvbin=SYNC_DEF.kvbin;
  if(!S.key)S.key=SYNC_DEF.key;
  return S;
}
function syncReady(){const S=syncCfg();return !!(S.rid||S.kvbin);}
function syncPayload(){
  const p={v:1,updated_at:nowISO(),app:'znajdz-taksowke'};
  for(const k of SYNC_KEYS)p[k]=ST[k]||{};
  return p;
}
/* — schowek 1: api.restful-api.dev (tworzy obiekt, potem PUT) — */
async function restGet(){
  const S=syncCfg();if(!S.rid)return null;
  const r=await fetch(STORE_A+S.rid,{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('schowek 1: HTTP '+r.status);
  const j=await r.json();
  return (j&&j.data)?j.data:null;
}
async function restPut(payload){
  const S=syncCfg();if(!S.rid)throw new Error('brak id schowka 1');
  const r=await fetch(STORE_A+S.rid,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'znajdz-taksowke',data:payload})});
  if(!r.ok)throw new Error('zapis 1: HTTP '+r.status);
}
/* — schowek 2: kvdb.io (zapasowy) — */
async function kvGet(){
  const S=syncCfg();if(!S.kvbin)return null;
  const r=await fetch(STORE_B+S.kvbin+'/'+S.key,{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('schowek 2: HTTP '+r.status);
  const t=await r.text();
  try{return JSON.parse(t);}catch(e){return null;}
}
async function kvPut(payload){
  const S=syncCfg();if(!S.kvbin)throw new Error('brak kodu schowka 2');
  const r=await fetch(STORE_B+S.kvbin+'/'+S.key,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('zapis 2: HTTP '+r.status);
}
/* — pobierz ze wszystkich schowków i scal — */
async function syncPull(){
  let out=null,errs=[];
  const tries=[['rest',restGet],['kv',kvGet]];
  for(const t of tries){
    try{const d=await t[1]();if(d&&typeof d==='object')out=out?mergeSync(out,d):d;}
    catch(e){errs.push(e.message);}
  }
  if(!out&&errs.length)throw new Error(errs.join(' · '));
  return out;
}
/* — zapisz do wszystkich schowków (wystarczy, że jeden przyjmie) — */
async function syncPush(payload){
  let okCount=0,errs=[];
  const tries=[restPut,kvPut];
  for(const f of tries){
    try{await f(payload);okCount++;}
    catch(e){errs.push(e.message);}
  }
  if(!okCount)throw new Error(errs.join(' · '));
  return okCount;
}
async function syncNow(silent){
  if(!syncReady()){if(!silent)toast('Synchronizacja nie ma ustawionego schowka.');return false;}
  try{
    const remote=await syncPull();
    let changed=false;
    if(remote){
      const before=JSON.stringify([ST.fav,ST.con,ST.dis]);
      const merged=mergeSync(ST,remote);
      if(JSON.stringify([merged.fav,merged.con,merged.dis])!==before){
        ST.fav=merged.fav;ST.con=merged.con;ST.dis=merged.dis;changed=true;
      }
    }
    const n=await syncPush(syncPayload());
    ST.syncStatus={at:nowISO(),msg:(changed?'pobrano zmiany z chmury':'zapisano')+(n>1?' (2 schowki)':'')};
    save();render();
    if(!silent&&changed)toast('☁️ Pobrano zmiany z innego urządzenia.',{ms:7000});
    else if(!silent)toast('☁️ Zapisano w chmurze.',{ms:5000});
    return true;
  }catch(e){
    ST.syncStatus={at:nowISO(),msg:'błąd: '+((e&&e.message)||e)};
    save();render();
    if(!silent)toast('⚠️ Nie udało się zapisać w chmurze: '+esc((e&&e.message)||e)+'. Dane zostały w telefonie.',{ms:12000});
    return false;
  }
}
let SYNC_T=null;
function scheduleSync(){
  const S=syncCfg();
  if(S.auto===false)return;
  clearTimeout(SYNC_T);
  SYNC_T=setTimeout(function(){syncNow(true);},2000);   /* 2 s po ostatnim kliknięciu */
}
function saveSyncSettings(){
  const S={rid:(val('syRid')||'').trim(),kvbin:(val('syKv')||'').trim(),
    key:(val('syKey')||'').trim()||SYNC_DEF.key,auto:chk('syAuto')};
  ST.settings.sync=S;save();
  toast('☁️ Zapisane — sprawdzam połączenie…',{ms:6000});
  render();
  syncNow(false);
}

/** Uszkodzone / powypadkowe / do naprawy — takie oferty w ogóle nie wchodzą do bazy. */
const DMG_RE=/uszkodz|powypadk|po wypadk|po dzwon|\bdzwon(ie|u|a|y)\b|po kolizji|\bkolizj|rozbity|rozbite|rozbit|anglik|do naprawy|do remontu|nie je[żz]dzi|nie jezdzi|szkoda ca[łl]kowit|\bszkod[ay]\b|zalany|spalon|zatart|\bwyciek|\bawari|\busterk|usterek\b|\bdefekt|bity|bita|st[łl]uczk|wymaga naprawy|wymaga remontu|brak dowodu|bez dowodu|bez papier|niekompletny|do lakierowania|na cz[eę][śs]ci/i;
const DMG_NEG=/bezwypadkow\w*|nieuszkodzon\w*|bezkolizyjn\w*|bezszkodow\w*|bezawaryjn\w*|bez ?(żadnych |jakichkolwiek )?(wypadk|uszkodz|szkod|koliz|usterek|defekt)\w*|nie\s?(ma |posiada )?(najmniejszych |żadnych |jakichkolwiek )?(uszkodz|usterek|defekt|wyciek|awari)\w*|brak\s?(jakichkolwiek |żadnych )?(uszkodz|usterek|defekt)\w*|nie\s?bit\w*|nie by[łl][ao]?\s?bit\w*/gi;
function isDamaged(o){
  if(!o)return false;
  if(o.dmg===true)return true;
  const t=String(o.title||'').replace(DMG_NEG,' ');
  return DMG_RE.test(t);
}
let DMG_N=0;                      /* ile ofert odsiano jako uszkodzone (do konsoli) */
function modelIsOn(m){
  /* brak wybranych modeli = wszystkie modele (i wszystkie przyciski zaznaczone) */
  const ms=ST.filters.models||[];
  return !ms.length||ms.indexOf(m)>-1;
}
function countForModel(m){
  /* ile ofert TEGO modelu przy pozostałych filtrach (bez filtra modeli) */
  try{
    const f=Object.assign({},ST.filters);f.models=[];
    return applyFilters(offersArr(),f,cfg(),Date.now()).filter(function(o){return o.model===m;}).length;
  }catch(e){return 0;}
}
function toggleModel(m){
  const f=ST.filters;
  if(!f.models)f.models=[];
  /* z „wszystkie” robimy jawną listę, żeby odznaczenie jednego modelu działało jak checkbox */
  if(!f.models.length)f.models=MODELS.slice();
  const i=f.models.indexOf(m);
  if(i>-1)f.models.splice(i,1);else f.models.push(m);
  /* nie można odznaczyć wszystkich — pusto znaczy „wszystkie” */
  if(!f.models.length)f.models=[];
  save();render();
}
function setLpg(v){ST.filters.lpg=v;save();render();}
function setSeller(v){ST.filters.seller=v;save();render();}
function resetFilters(){
  ST.filters=DEF().filters;save();render();
  toast('Filtry wyczyszczone.',{ms:3000});
}
function readFilters(){
  const f=ST.filters;
  const yf=val('fYearFrom'),yt=val('fYearTo');
  f.yearFrom=yf?+yf:'';
  f.yearTo=yt?+yt:'';
  if(f.yearFrom&&f.yearTo&&f.yearFrom>f.yearTo){const t=f.yearFrom;f.yearFrom=f.yearTo;f.yearTo=t;}
  f.milMax=val('fMil')?+val('fMil'):'';
  f.dist=(val('fDist')==='')?'':+val('fDist');
  f.sort=val('fSort')||'koszt';
  const bud=val('fBud');if(bud!=null)f.budget=bud;
  save();render();
}
function yearBounds(){
  let mn=null,mx=null;
  for(const o of offersArr()){
    const y=+o.year||0;if(!y)continue;
    if(mn==null||y<mn)mn=y;
    if(mx==null||y>mx)mx=y;
  }
  return [mn||2000,mx||new Date().getFullYear()];
}
/* --- liczniki i zakładki --- */
function counts(){
  const c={total:0,all:0,neu:0,fav:0,con:0,dis:0};
  for(const o of offersArr()){
    c.total++;
    if(isDis(o.id)){c.dis++;continue;}
    c.all++;
    const s=statusOf(o,ST);
    if(s.isNew||s.drop>0)c.neu++;
    if(isFav(o.id))c.fav++;
    if(isCon(o.id))c.con++;
  }
  return c;
}
function renderTabs(c){
  const T=[['new','🆕 Nowe',c.neu],['all','📋 Wszystkie',c.all],['fav','⭐ Obserwowane',c.fav],
    ['con','📞 Skontaktowane',c.con],['dis','🚫 Odrzucone',c.dis],['info','ℹ️ Info',null]];
  const t=el('tabs');if(!t)return;
  t.innerHTML=T.map(function(x){
    return '<button class="tab'+(TAB===x[0]?' on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]
      +(x[2]!=null?'<span class="b">'+x[2]+'</span>':'')+'</button>';
  }).join('');
}
function setTab(t){TAB=t;render();window.scrollTo({top:0,behavior:'smooth'});}
/* --- filtry: wygląd --- */
function countFor(patch){
  /* ile ofert zostałoby po włączeniu tej opcji (z pozostałymi filtrami) */
  try{
    const f=Object.assign({},ST.filters,patch);
    return applyFilters(offersArr(),f,cfg(),Date.now()).length;
  }catch(e){return 0;}
}
function chipHTML(label,on,onclick,n){
  const off=(n===0&&!on);
  return '<span class="chip'+(on?' on':'')+(off?' off':'')+'"'
    +(off?'':(' onclick="'+onclick+'"'))+'>'+label+(n!=null?('<span class="cnt">'+n+'</span>'):'')+'</span>';
}
function toggleExtra(key){
  ST.filters[key]=!ST.filters[key];
  save();render();
}
function renderExtra(){
  const box=el('chExtra');if(!box)return;
  const f=ST.filters;
  const items=[
    ['hideSusp','⚠️ Ukryj podejrzany przebieg'],
    ['hideNoLpg','💰 Ukryj poza budżetem po LPG'],
    ['hideShort','⏳ Ukryj krótsze niż kredyt 60 mc'],
    ['showNear','➕ Pokaż tuż nad budżetem']
  ];
  box.innerHTML=items.map(function(it){
    const k=it[0],on=!!f[k];
    const patch={};patch[k]=!on;
    const n=countFor(patch);
    /* „Ukryj poza budżetem po LPG” działa tylko z wybranym budżetem */
    if(k==='hideNoLpg'&&!f.budget){
      return '<span class="chip off" title="Najpierw wybierz budżet">'+it[1]+'<span class="cnt">—</span></span>';
    }
    return chipHTML(it[1],on,'toggleExtra(\''+k+'\')',n);
  }).join('');
}
function renderFilters(){
  const f=ST.filters;
  /* źródło: dwa przyciski, można oba naraz */
  const src=el('chSrc');
  if(src){
    const all=Object.keys(ST.db.offers).map(function(k){return ST.db.offers[k];});
    const nOto=all.filter(function(o){return o.src==='OTOMOTO';}).length;
    const nOlx=all.length-nOto;
    src.innerHTML=
      '<span class="chip'+(srcOn('olx')?' on':'')+'" onclick="setSrc(\'olx\','+(srcOn('olx')?'false':'true')+')">🟦 OLX<span class="cnt">'+nOlx+'</span></span>'
     +'<span class="chip'+(srcOn('otomoto')?' on':'')+'" onclick="setSrc(\'otomoto\','+(srcOn('otomoto')?'false':'true')+')">🟨 OTOMOTO<span class="cnt">'+nOto+'</span></span>';
  }
  /* budżet jako kompaktowa lista rozwijana */
  const bu=el('fBud');
  if(bu){
    bu.innerHTML=BUD.map(function(x){return '<option value="'+x[1]+'">'+x[0]+'</option>';}).join('');
    bu.value=String(f.budget==null?'':f.budget);
  }
  const d=el('chDate');
  if(d)d.innerHTML=DAYS.map(function(x){
    const on=+(f.days||0)===+x[1];
    return chipHTML(x[0],on,'setDays('+x[1]+')',countFor({days:+x[1]}));
  }).join('');
  const m=el('chModels');
  if(m)m.innerHTML=MODELS.map(function(x){
    return chipHTML(x,modelIsOn(x),"toggleModel('"+x+"')",countForModel(x));
  }).join('');
  const l=el('chLpg');
  if(l)l.innerHTML=LPGM.map(function(x){
    const on=String(f.lpg)===String(x[1]);
    return chipHTML(x[0],on,"setLpg('"+x[1]+"')",countFor({lpg:x[1]}));
  }).join('');
  const sd=el('chSeller');
  if(sd)sd.innerHTML=SELL.map(function(x){
    const on=String(f.seller)===String(x[1]);
    return chipHTML(x[0],on,"setSeller('"+x[1]+"')",countFor({seller:x[1]}));
  }).join('');

  const yb=yearBounds(),key=yb[0]+'-'+yb[1];
  const yf=el('fYearFrom'),yt=el('fYearTo');
  if(yf&&yt&&YBUILT!==key){
    let o1='<option value="">rocznik od: dowolny</option>',o2='<option value="">rocznik do: dowolny</option>';
    for(let y=yb[0];y<=yb[1];y++){
      o1+='<option value="'+y+'">od '+y+'</option>';
      o2+='<option value="'+y+'">do '+y+'</option>';
    }
    yf.innerHTML=o1;yt.innerHTML=o2;YBUILT=key;
  }
  if(yf)yf.value=f.yearFrom?String(f.yearFrom):'';
  if(yt)yt.value=f.yearTo?String(f.yearTo):'';
  const mi=el('fMil');if(mi)mi.value=(f.milMax===''||f.milMax==null)?'':String(f.milMax);
  const di=el('fDist');if(di)di.value=(f.dist===''||f.dist==null)?'':String(f.dist);
  const so=el('fSort');if(so)so.value=f.sort||'koszt';
  renderExtra();
}
function renderStatus(c){
  const st=el('status');if(!st)return;
  const lr=ST.lastRefresh.at?d2(ST.lastRefresh.at):'—';

/* --- karta oferty --- */
function odmLata(l){return l===1?'rok':((l>=2&&l<=4)?'lata':'lat');}
function rokPill(o,cf){
  const rk=rokKoniec(o,cf),m=miesPracy(o,cf);
  if(rk==null||m==null)return '';
  const cls=m>=84?'pOk':(m>=48?'pWar':'pBad');
  return '<span class="pill '+cls+'">🚕 Bolt do '+rk+' · '+okresTxt(m)+'</span>';
}
function kredytPill(o,cf){
  const m=miesPracy(o,cf);
  if(m==null)return '';
  if(m<48)return '<span class="pill pBad" title="Kliknij, żeby odrzucić z powodem" style="cursor:pointer" onclick="rejectWith(\''+o.id+'\',\'kredyt\')">⛔ '+okresTxt(m)+' — krócej niż kredyt 48 mc</span>';
  if(m<60)return '<span class="pill pWar" title="Kliknij, żeby odrzucić z powodem" style="cursor:pointer" onclick="rejectWith(\''+o.id+'\',\'kredyt\')">⚠️ '+okresTxt(m)+' — krócej niż kredyt 60 mc</span>';
  return '';
}
function chkLine(o){
  const c=(ST.checks||{})[o.id];
  if(!c)return '';
  const when=new Date(c.at).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})+' '+new Date(c.at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  if(c.st==='active')return '<div class="chkline chkA">🔍 sprawdzone '+when+' ('+esc(c.src)+') · ✅ aktywne'+(c.valid_to?(' — ważne do '+d2(c.valid_to)):'')+'</div>';
  if(c.st==='gone')return '<div class="chkline chkG">🔍 sprawdzone '+when+' ('+esc(c.src)+') · ❌ nieaktywne</div>';
  if(c.st==='likely')return '<div class="chkline chkU">🔍 sprawdzone '+when+' ('+esc(c.src)+') · 🕰️ prawdopodobnie aktywne'+(c.valid_to?(' — z danych ważne do '+d2(c.valid_to)):'')+'</div>';
  return '<div class="chkline chkU">🔍 sprawdzone '+when+' · ❓ nie udało się potwierdzić</div>';
}
function costBlock(o,cf){
  const c=kosztOf(o.price,o.lpg,cf);
  const rows=c.parts.map(function(p){
    return '<tr><td>'+esc(p.n)+'</td><td class="n">'+(p.v?fmt(p.v):'0 zł')+'</td></tr>';
  }).join('');
  const lpgTxt=o.lpg?'LPG w cenie':'LPG doliczone';
  return '<details class="cost"><summary><b>Koszt całkowity: '+fmt(c.koszt)+'</b> '
    +'<span class="hint">'+lpgTxt+' · dotknij, żeby zobaczyć rozbicie</span></summary>'
    +'<table><tr><th>Składnik</th><th class="n">Kwota</th></tr>'+rows
    +'<tr><th>RAZEM</th><th class="n">'+fmt(c.koszt)+'</th></tr></table>'
    +'<p class="small" style="margin:6px 0 0;">Ubezpieczenie OC taxi na 1. rok jest wliczone w kwotę. '
    +'Bufor napraw 3 000–5 000 zł celowo poza kosztem — pokazuję go dopiero jako wariant raty +3k / +5k.</p>'
    +'</details>';
}
function ratesBlock(o,cf){
  const c=kosztOf(o.price,o.lpg,cf);
  const row=function(lbl,arr){

  };

function rejBlock(o){

function metaLine(o){
  const p=['<b>'+esc(o.model||'?')+'</b>',String(o.year||'?'),(o.mileage!=null?fmtN(o.mileage)+' km':'przebieg ?')];
  if(o.city)p.push(esc(o.city));
  if(o.dist_km!=null)p.push(o.dist_km+' km od Katowic');
  if(o.business)p.push('firma/komis');
  return p.join(' · ');
}
function card(o){
  const cf=cfg(),s=statusOf(o,ST),dis=isDis(o.id)?ST.dis[o.id]:null,c=kosztOf(o.price,o.lpg,cf);
  const b=[];
  if(s.isNew&&!s.missing)b.push('<span class="pill pNew">🆕 NOWA</span>');
  b.push(sourceOf(o)==='otomoto'?'<span class="pill pSrcOto">OTOMOTO</span>':'<span class="pill pSrcOlx">OLX</span>');
  if(s.drop>0)b.push('<span class="pill pDrop">🔻 cena −'+fmtN(s.drop)+' zł</span>');
  b.push(rokPill(o,cf));
  b.push(kredytPill(o,cf));
  b.push(o.lpg?'<span class="pill pLpg">LPG w cenie</span>':'<span class="pill pOut">LPG doliczone +'+fmtN(c.lpgAdd)+' zł</span>');
  const bc=budgetClass(c.koszt,ST.filters);
  if(ST.filters.budget)b.push(bc==='in'?'<span class="pill pIn">w budżecie</span>':(bc==='near'?'<span class="pill pNear">tuż nad budżetem</span>':'<span class="pill pOut">poza budżetem</span>'));
  if(s.expired)b.push('<span class="pill pGone">ogłoszenie wygasło</span>');
  else if(s.missing)b.push('<span class="pill pGone">zniknęła z '+(sourceOf(o)==='otomoto'?'OTOMOTO':'OLX')+'</span>');
  if(s.suspMil)b.push('<span class="pill pDrop">⚠️ podejrzany przebieg</span>');
  if(isFav(o.id))b.push('<span class="pill pFav">⭐ obserwowana</span>');
  if(isCon(o.id))b.push('<span class="pill pCon">📞 skontaktowany</span>');
  if(dis)b.push('<span class="pill pRej">🚫 '+esc(POW_LBL[dis.r]||dis.r)+(dis.note?(' — '+esc(dis.note)):'')+'</span>');

  const knr=kosztNaRok(o,cf);
  const on=!!(SELM&&SEL[o.id]);
  return '<div class="card'+(SELM?' cardsel':'')+(on?' onsel':'')+'" id="c-'+o.id+'"'
    +(SELM?(' onclick="cardSel(event,\''+o.id+'\')"'):'')+'>'
    +(SELM?('<div class="cbox">'+(on?'✓':'')+'</div>'):'')
    +'<div class="of">'
    +'<img loading="lazy" src="'+esc(String(o.img||'icon.svg').replace('{width}','400').replace('{height}','300'))+'" onerror="this.src=\'icon.svg\'" alt="">'
    +'<div><p class="ttl">'+esc(o.title)+'</p><div class="badges">'+b.join('')+'</div>'
    +'<div class="price">'+fmt(o.price)+' <small>cena ogłoszenia</small></div>'
    +'<div class="meta">'+metaLine(o)+'</div>'
    +costBlock(o,cf)
    +(knr?('<div class="small" style="margin-top:3px;">💰 koszt za rok pracy: <b>'+fmt(knr)+'/rok</b>'
      +(miesPracy(o,cf)!=null?(' (na Bolcie: '+okresTxt(miesPracy(o,cf))+')'):'')+'</div>'):'')
    +ratesBlock(o,cf)
    +'<div class="meta" style="margin-top:4px;">wystawione '+d2(o.created)+' · '
      +(sourceOf(o)==='otomoto'?('widziane '+d2(o.last_seen)):('ważne do '+d2(o.valid_to)))+'</div>'
    +chkLine(o)
    +'<div class="row">'
    +'<a class="ab pri" href="'+o.url+'" target="_blank" rel="noopener">🔗 Otwórz ogłoszenie</a>'
    +'<button class="ab'+(isFav(o.id)?' on':'')+'" onclick="toggleFav(\''+o.id+'\')">⭐ '+(isFav(o.id)?'Obserwuję':'Obserwuj')+'</button>'
    +'<button class="ab'+(isCon(o.id)?' onCon':'')+'" onclick="toggleCon(\''+o.id+'\')">📞 '+(isCon(o.id)?'Skontaktowany ✓':'Skontaktowałem')+'</button>'
    +'<button class="ab'+(dis?' dg on':'')+'" onclick="'+(dis?('restoreOffer(\''+o.id+'\')'):('askReject(\''+o.id+'\')'))+'">'+(dis?'↩ Przywróć':'🚫 Nie interesuje')+'</button>'
    +'<button class="ab" onclick="copyQ()">📋 Pytania</button>'
    +'<button class="ab"'+(OPEN['chk_'+o.id]?' disabled':'')+' onclick="checkOffer(\''+o.id+'\')">'
      +(OPEN['chk_'+o.id]?'<span class="spin2"></span> Sprawdzam…':'🔍 Sprawdź aktualność')+'</button>'
    +'</div>'

   +'<b>'+(bad?'⚠️':'✅')+' '+(bad?'Ostatni zapis się nie udał':'Zapisuje automatycznie')+'</b> · ostatnia próba: '+(st.at?when:'—')
   +(st.msg?('<br><span class="small">'+esc(st.msg)+'</span>'):'')
   +'</div>'
   +'<div class="row">'
   +'<button class="ab pri" onclick="syncNow(false)">☁️ Zapisz teraz</button>'
   +'<button class="ab" onclick="syncNow(false)">⬇️ Pobierz teraz</button>'
   +'</div>'
   +'<p class="small" style="margin:8px 0 0;"><b>Drugie urządzenie:</b> otwórz ten sam link i dodaj do ekranu głównego. '
   +'Bez dodatkowej konfiguracji.</p>'
   +'<p class="small" style="margin:4px 0 0;">Lista jest publiczna (same numery ogłoszeń). '
   +'Jeśli ktoś kiedyś zacznie dopisywać śmieci — w ustawieniach poniżej wpisujesz nowy kod schowka i po sprawie.</p>'
   +'<details class="f"><summary>Ustawienia zaawansowane (nie trzeba ruszać)</summary><div class="in">'
   +'<p class="small" style="margin:0 0 6px;">Schowek główny (restful-api.dev): identyfikator obiektu. Schowek zapasowy (kvdb.io): kod pojemnika i klucz. '
   +'Aplikacja zapisuje do obu i czyta z obu — jeśli jeden padnie, drugi nadal działa.</p>'
   +'<label>Schowek główny — ID obiektu</label>'
   +'<input type="text" id="syRid" value="'+esc(S.rid||'')+'" autocomplete="off">'
   +'<div class="grid2">'
   +'<div><label>Schowek zapasowy — kod</label><input type="text" id="syKv" value="'+esc(S.kvbin||'')+'" autocomplete="off"></div>'
   +'<div><label>Klucz</label><input type="text" id="syKey" value="'+esc(S.key||'')+'" autocomplete="off"></div>'
   +'</div>'
   +'<label style="margin-top:8px;"><input type="checkbox" id="syAuto" '+((S.auto!==false)?'checked':'')+' style="width:auto;margin-right:6px;">zapisuj automatycznie po każdej zmianie</label>'
   +'<div class="row"><button class="ab" onclick="saveSyncSettings()">💾 Zapisz ustawienia schowka</button></div>'
   +'</div></details>'
   +'<p class="small" style="margin:8px 0 0;">Bez chmury też działa: <b>Eksport danych</b> / <b>Import kopii</b> poniżej przenoszą listę plikiem.</p>';
}
function infoHTML(){
  const cf=cfg();
  const rows=BASE_PARTS.map(function(p){return '<tr><td>'+p[0]+'</td><td class="n">'+fmt(p[1])+'</td></tr>';}).join('');
  return '<div class="card">'
   +'<h3 style="margin:0 0 6px;">ℹ️ Jak liczę koszt całkowity, ratę i „do którego roku"</h3>'
   +'<p class="small" style="margin:0 0 8px;">Koszt całkowity = cena auta + montaż LPG (jeśli auto go nie ma) + formalności. '
   +'W formalnościach jest <b>OC taxi na 1. rok</b> i <b>wpis TAXI do dowodu</b>.</p>'
   +'<table><tr><th>Składnik formalności</th><th class="n">Kwota</th></tr>'+rows
   +'<tr><th>RAZEM formalności</th><th class="n">'+fmt(baseSum())+'</th></tr></table>'
   +'<p class="small" style="margin:6px 0 0;">Adnotacja TAXI w dowodzie jest <b>bezpłatna</b> — w koszcie jest tylko nowy dowód, tablice i nalepki. '
   +'OC taxi: w miastach 1 500–4 200 zł/rok, przyjąłem <b>3 000 zł</b>. Bez kasy fiskalnej i licencji (lekarz, psychotesty, KRK) — to nie jest potrzebne w Uberze i Bolcie.</p>'
   +'<p class="small" style="margin:6px 0 0;">Montaż LPG (gdy auto go nie ma): <b>'+fmt(cf.lpg)+'</b> — instalacja ok. 4 900 zł + badanie gazowe 96 zł. '
   +'Raty orientacyjne: 48 mc = koszt × 0,024952, 60 mc = koszt × 0,020793; druga i trzecia liczba to rata po doliczeniu bufora +3 000 / +5 000 zł. '
   +'Bufor (naprawy) nie wchodzi do kosztu całkowitego.</p>'
   +'<p class="small" style="margin:6px 0 0;">Badge „🚕 Bolt do ROKU · czas" liczy <b>pełne miesiące</b> do 1 stycznia roku granicznego '
   +'(Bolt: auto do 20 lat). Przykład: rocznik 2011 w październiku 2026 → <b>4 lata 3 mc</b>. '
   +'Gdy zostaje mniej niż długość kredytu: <b>⚠️ krócej niż kredyt 60 mc</b> albo <b>⛔ krócej niż kredyt 48 mc</b>.</p>'
   +'<h3 style="margin:14px 0 6px;">🔍 Sprawdź aktualność</h3>'
   +'<p class="small" style="margin:0;">OLX: sprawdzam status ogłoszenia. OTOMOTO blokuje zapytania z przeglądarki, '
   +'więc pokazuję, kiedy ostatnio widział ją robot — z przyciskiem „🔗 Otwórz i zobacz". '
   +'Wynik zapisuje się na karcie. Bez internetu — status z daty ważności i propozycja ponowienia.</p>'
   +'<h3 style="margin:14px 0 6px;">🔄 Aktualizacja ofert</h3>'
   +'<p class="small" style="margin:0;">Robot na GitHubie odświeża <b>offers.json (OLX) co 4 godziny</b> oraz <b>otomoto.json 2 razy dziennie</b>. Aplikacja wczytuje oba przy starcie. '
   +'Przycisk „🔄 Odśwież" próbuje dodatkowo pobrać oferty z OLX na żywo. '
   +'<b>Uszkodzone, powypadkowe i „do naprawy" nie trafiają w ogóle na listę</b> — odsiewane przy wczytywaniu danych '
   +'(z obu portali). '
   +'Oferty, które zniknęły z portalu albo minęła ich ważność, trafiają automatycznie do <b>🚫 Odrzuconych</b> '
   +'(powód: nieaktualne) — można je stamtąd przywrócić.</p>'
   +'<h3 style="margin:14px 0 6px;">💾 Kopia danych</h3>'
   +'<p class="small" style="margin:0 0 8px;">Obserwowane, skontaktowane i odrzucone zapisują się <b>w tym telefonie</b>. Przenieść je na inne urządzenie można przez kopię.</p>'
   +'<div class="grid2">'
   +'<button class="ab" onclick="exportState()">💾 Eksport danych</button>'
   +'<button class="ab" onclick="document.getElementById(\'impFile\').click()">📥 Import kopii</button>'
   +'</div>'
   +'<input type="file" id="impFile" accept=".json" class="hide" onchange="importState(this)">'
   +'<div class="row"><button class="ab dg" onclick="clearAll()">🗑️ Wyczyść wszystko</button></div>'
   +srcInfoHTML()
   +syncInfoHTML()
   +'<h3 style="margin:14px 0 6px;">🧪 Test i wersja</h3>'
   +'<p class="small" style="margin:0 0 6px;">Wersja: <b id="ver2">v'+APPVER+'</b>. Jeśli w nagłówku nie ma „v'+APPVER+'", masz starszą wersję — odśwież stronę.</p>'
   +'<button class="ab pri" onclick="selfTest()">🧪 Uruchom test aplikacji</button>'
   +'<div id="testOut" class="log" style="min-height:0;"></div>'
   +'</div>';
}
async function selfTest(){
  const t=el('testOut'),out=[];
  const put=function(){if(t)t.textContent=out.join('\n');};
  const w=function(n,v){out.push((v?'✅ ':'❌ ')+n);put();};
  out.push('Test aplikacji v'+APPVER+' · '+new Date().toLocaleString('pl-PL'));put();
  try{
    const ve=el('ver');
    w('Numer wersji w nagłówku (ma być v'+APPVER+')',!!ve&&String(ve.textContent).indexOf(APPVER)>-1);
    w('Elementy interfejsu (lista, zakładki, filtry)',!!(el('list')&&el('tabs')&&el('filtersBox')));
    let ok=false;try{localStorage.setItem('tf_test','1');ok=(localStorage.getItem('tf_test')==='1');localStorage.removeItem('tf_test');}catch(e){}
    w('Zapis w pamięci telefonu (localStorage)',ok);
    const list=offersArr();
    w('Oferty w pamięci: '+list.length,list.length>0);
    w('Oferty mają link do ogłoszenia',list.slice(0,10).every(function(o){return !!o.url;}));
    toast('✅ Test krok 1: komunikaty działają (widzisz ten pasek na dole).',{ms:6000});
    if(!list.length){out.push('');out.push('Brak ofert — kliknij „🔄 Odśwież".');put();return;}
    let net=false,which='';
    const rs=RELAYS.filter(function(R){return !(R.n==='worker'&&!ST.settings.worker);});
    for(let i=0;i<rs.length;i++){
      try{await relayGet('https://www.olx.pl/api/v1/offers/'+String(list[0].id).replace('olx-','')+'/',rs[i],3500);net=true;which=rs[i].n;break;}catch(e){}
    }
    w('Połączenie z OLX '+(net?('działa (przez '+which+')'):'(brak) — „Sprawdź aktualność" pokaże wtedy wariant z danych'),net);
    out.push('');
    out.push(net?'✅ Wszystko gotowe.':'⚠️ Część testów nie przeszła — zrób zrzut tego ekranu i wyślij, poprawię.');
    put();
  }catch(e){out.push('❌ Błąd testu: '+((e&&e.message)||e));put();}
}
/* --- render --- */
function render(){
  try{renderX();}catch(e){errShow('Nie udało się odświeżyć widoku: '+((e&&e.message)||e));}
}
function renderX(){
  const c=counts();
  renderStatus(c);
  renderTabs(c);
  renderFilters();
  const box=el('list'),info=el('infoCard');
  const fb=el('filtersBox');if(fb)fb.classList.toggle('hide',TAB==='info');
  const qb=el('qbar');if(qb)qb.classList.toggle('hide',TAB==='info');
  if(TAB==='info'){const bb=el('bulkbar');if(bb){bb.className='bulkbar';bb.innerHTML='';}}
  if(TAB==='info'){
    if(box)box.innerHTML='';
    if(info)info.innerHTML=infoHTML();
    return;
  }
  if(info)info.innerHTML='';
  let list=listNow();
  if(!box)return;
  if(!list.length){
    const msg=TAB==='fav'?'Brak obserwowanych. Kliknij „⭐ Obserwuj" przy ofercie, którą chcesz mieć pod ręką.'
      :TAB==='con'?'Nie masz jeszcze ofert oznaczonych jako skontaktowane.'
      :TAB==='dis'?'Brak odrzuconych ofert.'
      :TAB==='new'?'Brak nowych ofert od ostatniej wizyty. Kliknij „🔄 Odśwież", żeby sprawdzić OLX.'
      :'Brak ofert dla tych filtrów.';
    box.innerHTML='<div class="empt">'+msg+'</div>';
    renderBulk();
    return;
  }
  const cap=TAB==='new'?('Nowe i ze spadkiem ceny ('+list.length+')')
    :TAB==='fav'?('Obserwowane ('+list.length+')')
    :TAB==='con'?('Skontaktowane ('+list.length+')')
    :TAB==='dis'?('Odrzucone ('+list.length+')')
    :('Wyniki ('+list.length+')');
  box.innerHTML='<p class="small" style="margin:8px 2px;">'+cap+'</p>'+list.slice(0,200).map(card).join('');
  renderBulk();
}
function init(){
  try{
    if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister().catch(function(){});});}).catch(function(){});
    }
  }catch(e){}
  load();
  OPEN={};
  seedInto();
  autoRejectGone();
  const ve=el('ver');if(ve)ve.textContent='v'+APPVER;
  render();
  loadCloud().then(function(k){CLOUD_AT=Date.now();if(k){save();render();}});
  if(srcOn('otomoto'))loadOtomoto().then(function(k){if(k){save();render();}});
  scheduleCloud();
  if(syncReady())syncNow(true);
  window.addEventListener('pagehide',function(){ST.lastVisit=Date.now();save();});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ST.lastVisit=Date.now();save();return;}
    if(Date.now()-CLOUD_AT>30*60*1000)cloudTick();   // po powrocie do apki: dociągnij świeże oferty
    if(syncReady()){const s=ST.syncStatus||{};if(!s.at||(Date.now()-new Date(s.at).getTime())>5*60*1000)syncNow(true);}
  });
  window.addEventListener('error',function(e){try{errShow((e&&e.message)||'nieznany błąd');}catch(_){}});
  window.addEventListener('unhandledrejection',function(e){
    try{const r=e&&e.reason;errShow((r&&r.message)?r.message:String(r||''));}catch(_){}
  });
}
document.addEventListener('DOMContentLoaded',init);
</script>
